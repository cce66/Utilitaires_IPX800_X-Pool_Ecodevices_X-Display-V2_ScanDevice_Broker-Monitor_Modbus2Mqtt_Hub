<!-- Mode normal  : GCE_X-DISPLAY-V2_Virtuel_v1.html                      --!>
<!-- Mode mini    : GCE_X-DISPLAY-V2_Virtuel_v1.html?mode=mini            --!>

<!-- → Affiche que l'appareil virtuel centré (affichage tablette murale)  --!>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>X-Display v2 — Écran virtuel v1</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════════
       VARIABLES GLOBALES — Palette de couleurs et espacements
       --accent     : vert GCE (boutons actifs, barre verticale écran)
       --accent2    : bleu (cercle interrupteur, chevrons sidebar)
       --xd-bg      : fond noir de l'écran simulateur
       --gap        : espacement standard entre les panneaux
    ═══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117; --panel: #181c27; --border: #2a2f3e; --accent: #6CC04A;
      --accent-dim: rgba(108,192,74,0.2); --accent2: #0090ff; --accent3: #ff6b35;
      --pool: #06b6d4; --text: #d4d8e8; --text-dim: #7a809a; --text-faint: #4b556b;
      --danger: #e05252; --header-h: 58px; --gap: 14px; --highlight: #ffd966;
      --xd-bg: #080a0d;
    }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; overflow: hidden; }
    header { position: fixed; top:0; left:0; right:0; z-index:200; height:var(--header-h); display:flex; align-items:center; gap:10px; padding:0 24px; background:var(--panel); border-bottom:1px solid var(--border); box-shadow:0 2px 20px rgba(0,0,0,0.6); }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-box { width:110px; height:32px; background:linear-gradient(135deg,#388bfd 0%,#3fb950 55%); border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; color:#000; }
    header h1 { font-family:'IBM Plex Mono',monospace; font-size:0.85rem; font-weight:600; letter-spacing:0.04em; color:#fff; white-space:nowrap; }
    .header-sep { flex:1; }
    .cfg-field { display:flex; align-items:center; gap:8px; }
    .cfg-field label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; white-space:nowrap; }
    .cfg-field input, .cfg-field select { height:30px; background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--accent); padding:0 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none; transition:border-color 0.2s; }
    .cfg-field input:focus, .cfg-field select:focus { border-color:var(--pool); }
   
     /* ---------- BOUTONS ---------- */
    .btn { height:30px; padding:0 12px; border:none; border-radius:5px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:600; transition:opacity 0.2s, transform 0.1s; white-space:nowrap; }
    .btn:active { transform:scale(0.97); }
    .btn-primary { background:var(--accent); color:#000; }
    .btn-secondary { background:var(--border); color:var(--text); }
    .btn-secondary:hover { background:#343a4e; }
    .btn-sm { height:26px; padding:0 10px; font-size:11px; }

     /* ----------  ---------- */
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--text-dim); transition:background 0.3s; }
    .status-dot.connected { background:var(--accent); box-shadow:0 0 8px var(--accent); }
    .status-dot.error { background:var(--accent3); box-shadow:0 0 8px var(--accent3); }

    /* ── MISE EN PAGE PRINCIPALE ──────────────────────────────────
       app-body : conteneur flex horizontal fixé sous le header
       Contient : panneau éditeur | séparateur | panneau preview | séparateur | panneau droit
    ────────────────────────────────────────────────────────────── */
    .app-body { position:fixed; top:var(--header-h); left:0; right:0; bottom:0; display:flex; gap:0; padding:var(--gap); overflow:hidden; }
    /* ── PANNEAU ÉDITEUR (colonne gauche) ─────────────────────────
       Contient la liste des écrans et le formulaire de configuration
       de chaque écran (nom, type, paramètres MQTT, valeurs)
    ────────────────────────────────────────────────────────────── */
    .editor-panel { margin-right:0; }
    /* Le panneau éditeur devient une colonne flex avec 3 zones redimensionnables */
    .editor-topics-panel {
      display:flex; flex-direction:column;
      flex:1; min-height:80px;
      border-top:1px solid var(--border);
      overflow:hidden;
    }
    .editor-topics-panel .panel-header { padding:6px 10px; background:rgba(255,255,255,0.02); }
    /* Styles des lignes topics dans le cadre éditeur (reprend xp-topic-row) */
    .ed-topic-row {
      display:grid; grid-template-columns:1fr 32px 32px;
      gap:3px; align-items:center;
      background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05);
      border-radius:5px; padding:3px 5px; margin-bottom:2px;
    }
    .ed-topic-input {
      background:transparent; border:none; outline:none;
      color:rgba(180,210,255,0.8); font-size:0.58rem;
      font-family:'IBM Plex Mono',monospace; width:100%; min-width:0;
    }
    .ed-topic-section {
      font-size:0.6rem; font-weight:600; color:rgba(220,230,255,0.6);
      font-family:'Outfit'; padding:4px 0 2px; border-bottom:1px solid rgba(255,255,255,0.05);
      margin-bottom:3px;
    }
    .right-panel { margin-left:0; }

     /* ----------  ---------- */
    /* ── PANNEAU ÉDITEUR (colonne gauche) ─────────────────────────
       Contient la liste des écrans et le formulaire de configuration
       de chaque écran (nom, type, paramètres MQTT, valeurs)
    ────────────────────────────────────────────────────────────── */
    .editor-panel { width:450px; min-width:320px; display:flex; flex-direction:column; gap:0; overflow:visible; }
    .editor-top { padding:10px 16px; background:#1e2333; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .editor-top-label { font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); flex-basis:100%; }

     /* ----------  ---------- */
    .screen-list { flex:1; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
    .screen-list::-webkit-scrollbar { width:4px; }
    .screen-list::-webkit-scrollbar-track { background:transparent; }
    .screen-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .screen-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; transition:all 0.18s; cursor:pointer; }
    .screen-card.selected { border-color:var(--accent); background:rgba(108,192,74,0.04); box-shadow:0 0 0 1px var(--accent-dim); }

     /* ----------  ---------- */
    .card-header { display:flex; align-items:center; padding:10px 12px; gap:8px; flex-wrap:wrap; cursor:pointer; }
    .card-chevron { user-select:none; font-size:0.7rem; color:rgba(180,190,220,0.5); width:12px; text-align:center; transition:color 0.15s; }
    .card-header:hover .card-chevron { color:rgba(180,190,220,0.9); }
    .card-num { font-size:0.65rem; font-family:'IBM Plex Mono',monospace; color:var(--text-dim); background:var(--panel); padding:2px 7px; border-radius:4px; min-width:28px; text-align:center; }
    .card-header input[type="text"] { background:var(--panel); border:1px solid var(--border); padding:5px 10px; border-radius:5px; color:white; font-weight:500; font-size:0.82rem; width:110px; font-family:'IBM Plex Sans',sans-serif; }
    .card-header input[type="text"]:focus { outline:none; border-color:var(--accent); }

     /* ----------  ---------- */
    .type-select { background:var(--panel); border:1px solid var(--border); padding:5px 10px; border-radius:5px; color:white; font-weight:500; font-size:0.78rem; flex:1; font-family:'IBM Plex Sans',sans-serif; }
    .type-select:focus { outline:none; border-color:var(--accent); }

     /* ----------  ---------- */
    .delete-btn { background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px 6px; border-radius:6px; transition:0.15s; font-size:0.9rem; }
    .delete-btn:hover { color:var(--danger); background:rgba(224,82,82,0.1); }
    .card-details { padding:10px 12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }

     /* ----------  ---------- */
    .param-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .param-row label { width:130px; font-size:0.72rem; color:var(--text-dim); font-weight:500; }
    .param-row input, .param-row select { background:var(--panel); border:1px solid var(--border); padding:4px 8px; border-radius:5px; color:white; font-size:0.78rem; flex:1; min-width:100px; font-family:'IBM Plex Mono',monospace; }
    .param-row input:focus, .param-row select:focus { outline:none; border-color:var(--accent); }
    /* ── PANNEAU PREVIEW (colonne centrale) ───────────────────────
       Contient le simulateur visuel du X-Display V2
       device-shell    : boîtier physique (360×360px)
       device-casing   : cadre plastique gris autour de l'écran
       screen-bezel    : bord intérieur du cadre
       screen-surface  : surface noire de l'écran (fond de simulation)
    ────────────────────────────────────────────────────────────── */
    .preview-panel { flex:1; min-width:300px; background:var(--bg); border-radius:8px; border:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

     /* ----------  ---------- */
    .global-toolbar { background:var(--panel); border-bottom:1px solid var(--border); padding:6px 6px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:flex-start; }
    .global-toolbar-group { display:flex; gap:8px; align-items:center; background:var(--bg); padding:8px 8px; border-radius:30px; border:1px solid var(--border); }
    .global-toolbar-label { font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; }

     /* ----------  ---------- */
    .global-btn { height:24px; padding:0 16px; font-size:0.9rem; font-weight:600; border-radius:30px; background:#1e2333; border:1px solid var(--border); color:var(--text); cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.15s; }
    .global-btn:hover { background:var(--border); border-color:var(--accent); }
    .global-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }

    .autooff-input { width:65px; background:var(--bg); border:1px solid var(--border); border-radius:30px; padding:6px 10px; color:white; text-align:center; font-weight:bold; }

     /* ----------  ---------- */
    .preview-container { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px; position:relative; overflow:hidden; }
    .preview-label { font-size:0.7rem; text-transform:uppercase; color:var(--text-faint); display:flex; align-items:center; gap:8px; width:100%; max-width:500px; }
    .preview-label::before, .preview-label::after { content:''; height:1px; flex:1; background:var(--border); }

    /* Zone Preview */
   
    .preview-footer {
      display: flex; gap: 8px; padding: 10px 14px;
      border-top: 1px solid var(--border); background: var(--panel);
      flex-wrap: wrap;
      justify-content: center; /* horizontal */
      align-items: center;     /* vertical */
      text-align: center;
    }

    /* === DEVICE SHELL - Carré fidèle au vrai X-Display === */
    .device-shell { position:relative; width:360px; height:360px; }
    .device-casing {
      position:absolute; inset:-22px;
      background:linear-gradient(160deg, #d8dce4 0%, #c8ccd6 30%, #b8bcc6 70%, #a8acb6 100%);
      border-radius:0;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.5),
        0 0 0 2px rgba(0,0,0,0.2),
        0 20px 60px rgba(0,0,0,0.7),
        0 8px 20px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.7),
        inset 0 -1px 0 rgba(0,0,0,0.2);
    }

    /* LED indicateur en haut */
    .device-casing::before {
      content:'';
      position:absolute; top:8px; right:24px;
      width:5px; height:5px;
      border-radius:50%;
      background:#6CC04A;
      box-shadow:0 0 6px #6CC04A, 0 0 12px rgba(108,192,74,0.5);
    }
    .screen-bezel {
      position:absolute; inset:0;
      background:#050709;
      border-radius:0;
      overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
    }
    /* Reflet de l'écran */
    .screen-bezel::after {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%);
      pointer-events:none;
      z-index:500;
      border-radius:0;
    }
    .screen-surface {
      position:absolute; inset:0;
      background:var(--xd-bg);
      overflow:hidden;
      border-radius:0;
      transition:filter 0.3s;
    }
    .screen-surface.screen-off { filter:brightness(0) saturate(0); }
    .screen-surface.locked::after {
      content:'🔒';
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:2.5rem;
      background:rgba(0,0,0,0.8);
      padding:12px 20px;
      border-radius:40px;
      color:white;
      pointer-events:none;
      z-index:200;
      backdrop-filter:blur(4px);
    }

    /* ═══════════════════════════════════════════════════════════════
       SIMULATEUR X-DISPLAY — BARRE SUPÉRIEURE (statusbar)
       ┌─────────────────────────────────────────────────────────┐
       │ Date + Heure │    Temp 24.2° 🌿    │ Barre|Nom  │  ⚙  │
       │              │    Temp 24.2° 🌿    │ Barre|Nom  │  ⚙  │
       └─────────────────────────────────────────────────────────┘
       xd-datetime        : bloc date (orange) + heure (blanc, fin)
       xd-center-info     : zone centrale flex-colonne
       xd-temp-readout    : température + feuille verte 🌿
       xd-screen-name-bar : barre verte verticale (position fixe)
       xd-screen-name-spacer : espace invisible entre barre et texte
       xd-screen-name-text   : nom de l'écran courant
       xd-gear            : bouton ⚙ ouvre l'écran Configuration
    ═══════════════════════════════════════════════════════════════ */
    /* === STATUSBAR === */
    .xd-statusbar {
      position:absolute; top:0; left:0; right:0; height:67px;
      display:flex; align-items:center;
      padding:0 12px 0 0;
      background:rgba(0,0,0,0.0);
      z-index:20;
      border-bottom:1px solid rgba(255,255,255,0.04);
    }
    /* Date/heure : centré sur le milieu de la sidebar (66px) */
    .xd-datetime {
      width:69px; flex-shrink:0;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center;
    }
    .xd-date {
      font-size:0.8rem; color:rgba(255,160,40,0.9);
      font-family:'Outfit',sans-serif; font-weight:500;
      line-height:1.2; letter-spacing:0.03em;
      margin-bottom:1px;
    }
    .xd-time {
      font-size:1.5rem; color:#ffffff;
      font-family:'Outfit',sans-serif; font-weight:300;
      line-height:1;
    }
    /* Centre : temp+dot centrés, puis barre verte+nom sous le dot */
    .xd-center-info {
      flex:1; display:flex; flex-direction:column; align-items:center;
      position:relative;
    }
    .xd-temp-readout {
      font-size:0.8rem; font-weight:200; color:#e0e8f8;
      font-family:'Outfit',sans-serif;
      display:flex; align-items:center; gap:2px;
    }
    .xd-temp-dot { font-size:0.75rem; margin-left:2px; line-height:1; }
    /* Barre verte — position fixe indépendante du texte */
    .xd-screen-name-bar {
      position:absolute; top:22px; right:106px;
      width:3px; height:14px;
      background:var(--accent);
      border-radius:2px;
    }
    /* Spacer entre barre (finit à right:106px) et texte */
    .xd-screen-name-spacer {
      position:absolute; top:22px; right:100px;
      width:6px; height:14px;
      background:#111318;
    }
    .xd-screen-name-text {
      position:absolute; top:22px; right:100px;
      font-size:0.72rem; color:rgba(180,190,220,0.85);
      font-family:'Outfit',sans-serif; font-weight:400;
      white-space:nowrap;
      transform:translateX(100%);
    }
    .xd-gear {
      font-size:1.35rem; color:rgba(255,255,255,0.75);
      cursor:pointer; width:28px; height:28px;
      display:flex; align-items:center; justify-content:center;
      border-radius:6px; transition:0.2s; flex-shrink:0;
    }
    .xd-gear:hover { background:rgba(255,255,255,0.05); color:white; }

    /* ═══════════════════════════════════════════════════════════════
       SIMULATEUR X-DISPLAY — BARRE LATÉRALE GAUCHE (sidebar)
       ┌──────┐
       │  ∧   │  nav-arrow-btn haut  : chevron bleu ↑ (écran précédent)
       │ [1]  │  xd-nav-icon        : bouton écran 1 (fond gris / vert si actif)
       │ [2]  │  xd-nav-icon        : bouton écran 2
       │ [3]  │  xd-nav-icon        : bouton écran 3
       │  ∨   │  nav-arrow-btn bas  : chevron bleu ↓ (écran suivant)
       └──────┘
       nav-num : numéro de l'écran affiché à gauche du bouton (vert)
       xd-nav-icons-wrap : flex-colonne space-evenly entre les 2 chevrons
       Largeur sidebar = 69px | Boutons = 50×50px | Icônes = 23×23px
    ═══════════════════════════════════════════════════════════════ */
    /* === SIDEBAR === */
    .xd-sidebar {
      position:absolute; left:0; top:0; bottom:0; width:69px;
      background:rgba(0,0,0,0.75);
      backdrop-filter:blur(20px);
      border-right:1px solid rgba(255,255,255,0.06);
      display:flex; flex-direction:column;
      align-items:center;
      padding:75px 0 14px;
      justify-content:space-between;
      z-index:15;
    }
    .nav-arrow-btn {
      width:32px; height:32px;
      border-radius:50%;
      background:transparent;
      border:2px solid rgba(0,144,255,0.7);
      color:rgba(0,144,255,0.9);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      transition:0.15s; flex-shrink:0;
    }
    .nav-arrow-btn:hover { background:rgba(0,144,255,0.1); }
    .nav-arrow-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    /* Conteneur des 3 icônes — occupe tout l'espace entre les chevrons avec gaps égaux */
    .xd-nav-icons-wrap {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:space-evenly;
      width:100%; padding:0;
    }
    .xd-nav-icon {
      width:50px; height:50px;
      border-radius:10px;
      background:rgba(60,65,80,0.6);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      transition:all 0.2s;
      border:1px solid rgba(255,255,255,0.08);
      position:relative;
    }
    .xd-nav-icon:hover { background:rgba(255,255,255,0.08); }
    .xd-nav-icon.active {
      background:var(--accent);
      border-color:var(--accent);
      box-shadow:0 0 12px rgba(108,192,74,0.4), 0 2px 6px rgba(0,0,0,0.4);
    }
    .xd-nav-icon svg { width:23px; height:23px; fill:none; stroke:rgba(255,255,255,0.5); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .xd-nav-icon.active svg { stroke:rgba(0,0,0,0.85); }
    /* Numéro à gauche du bouton, centré dans l'espace entre bord et bouton (66-44)/2 = 11px de chaque côté */
    .nav-num {
      position:absolute; right:calc(100% + 1px); top:50%; transform:translateY(-50%);
      font-size:0.58rem;
      color:var(--accent);
      font-family:'IBM Plex Mono',monospace;
      font-weight:700; line-height:1;
    }

    /* ═══════════════════════════════════════════════════════════════
       SIMULATEUR X-DISPLAY — ZONE DE CONTENU CENTRAL (xd-content)
       Positionné après la sidebar (left:69px) et sous la statusbar (top:67px)
       Contient le rendu de l'écran actif (thermostat, interrupteur, volet…)
       xd-icon-edit : bouton crayon ✎ coin bas-droite → ouvre l'icon picker
    ═══════════════════════════════════════════════════════════════ */
    /* === CONTENT AREA === */
    .xd-content {
      position:absolute;
      top:67px; left:69px; right:0; bottom:0;
      padding:8px 10px;
      overflow:hidden;
      display:flex; flex-direction:column;
    }

    /* Petit badge d'édition icône en bas à droite */
    .xd-icon-edit {
      position:absolute; bottom:8px; right:8px;
      width:26px; height:26px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.75);
      border-radius:6px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem;
      color:rgba(255,255,255,0.75);
      cursor:pointer;
      z-index:30;
      transform:scaleX(-1);
    }
    .xd-icon-edit:hover { color:white; border-color:white; background:rgba(255,255,255,0.08); }

    /* ═══════════════════════════════════════════════════════════════
       ÉCRAN ECODEVICES 3 (type 17)
       Zone utile : left:69px top:67px → ~291×249px
       Tores : grille 4×2, police mono condensée, max 99999W sur une ligne

       Rendu via canvas HTML5 (drawThermoCanvas)
       xd-thermostat  : conteneur flex centré, padding-top pour décaler le canvas
       thermoCanvas   : 255×255px — dessiné par drawThermoCanvas()
       thermo-onoff   : bouton ⏻ ON/OFF (position absolue haut-droite du canvas)
       thermo-controls: bloc "− Consigne +" en position absolue bas du contenu

    ═══════════════════════════════════════════════════════════════ */
    /* ============================================================
       ÉCRAN THERMOSTAT - fidèle capture
    ============================================================ */
    .xd-thermostat {

      height:100%; justify-content:center;
      gap:6px; position:relative;
      padding-top:14px;
    }
    .thermo-ring { display:none; }
    .thermo-ring-inner { display:none; }
    .thermo-flame { display:none; }
    .thermo-knob { display:none; }

      position:absolute; top:4px; right:4px;

    .thermo-setpoint { font-size:1.1rem; color:rgba(180,200,255,0.45); font-family:'Outfit',sans-serif; font-weight:300; margin-top:2px; }

    /* ═══════════════════════════════════════════════════════════════
       ÉCRAN INTERRUPTEUR (type 1) / MAISON (type 2)
       xd-switch      : conteneur, padding-top:38px pour centrer le cercle
                        sur le centre du bouton du milieu de la sidebar
       switch-ring    : cercle bleu 210×210px (= hauteur des 3 boutons sidebar)
                        bleu clair rgba(40,180,255) — toujours affiché
       switch-inner   : carré blanc arrondi 59×59px centré dans le cercle
                        contient l'icône SVG power (même que sidebar type 1)
       switch-label   : texte "On"/"Off" en position absolue, bottom:79px
                        aligné légèrement au-dessus du centre du 3ème bouton
    ═══════════════════════════════════════════════════════════════ */
    /* ============================================================
       INTERRUPTEUR / MAISON - fidèle capture (grand cercle bleu)
    ============================================================ */
    .xd-switch {
      display:flex; align-items:flex-start;
      justify-content:center; height:100%;
      padding-top:38px;
    }
    .switch-ring {
      width:200px; height:200px; border-radius:50%;
      border:2.5px solid rgba(0,144,255,0.55);
      box-shadow:0 0 24px rgba(40,180,255,0.15);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all 0.3s; position:relative;
    }
    .switch-ring.on {
      border-color:rgba(40,180,255,1.0);
      box-shadow:0 0 18px 6px rgba(40,180,255,0.55), 0 0 48px 10px rgba(40,180,255,0.25), inset 0 0 60px 15px rgba(40,180,255,0.25), inset 0 0 20px 5px rgba(40,180,255,0.15);
    }
    .switch-inner {
      width:59px; height:59px; border-radius:16px;
      background:#ffffff;
      display:flex; align-items:center; justify-content:center;
      transition:0.3s;
    }
    .switch-inner svg { width:32px; height:32px; }
    .switch-label {
      position:absolute; bottom:79px;
      width:100%; text-align:center;
      font-size:0.95rem; font-family:'Outfit',sans-serif; font-weight:400;
      color:rgba(200,210,230,0.5);
      pointer-events:none;
    }
    .switch-label.on { color:rgba(220,230,255,0.9); }

    /* ═══════════════════════════════════════════════════════════════
       ÉCRAN VOLET (type 3)
       xd-shutter     : conteneur centré
       shutter-row    : disposition horizontale volet + boutons, margin-left:-30px
                        pour décaler l'ensemble vers la gauche
       shutter-visual : représentation visuelle du volet (bordure blanche)
                        shutter-slats : lamelles animées selon la position %
       shutter-btns   : colonne de 3 boutons (▲ stop ▼) en cercles bleus
       shutter-pct    : affichage du pourcentage d'ouverture
       shutter-slider : input range caché (contrôle via JS)
    ═══════════════════════════════════════════════════════════════ */
    /* ============================================================
       VOLET - fidèle capture
    ============================================================ */
    .xd-shutter {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; height:100%; gap:8px;
    }
    .shutter-row { display:flex; align-items:center; gap:20px; }
    .shutter-visual {
      width:100px; height:120px;
      border:2px solid rgba(255,255,255,0.7);
      border-radius:2px;
      position:relative; overflow:hidden;
      background:#000;
    }
    /* Rail supérieur */
    .shutter-visual::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:10px;
      background:rgba(255,255,255,0.85);
      z-index:2;
    }
    .shutter-slats {
      position:absolute; top:10px; left:0; right:0;
      transition:height 0.4s;
      overflow:hidden;
    }
    .shutter-slats::before {
      content:'';
      display:block; width:100%;
      background:repeating-linear-gradient(180deg,
        rgba(255,255,255,0.82) 0px, rgba(255,255,255,0.82) 5px,
        rgba(255,255,255,0.12) 5px, rgba(255,255,255,0.12) 7px
      );
      height:200px;
    }
    .shutter-btns { display:flex; flex-direction:column; gap:8px; align-items:center; margin-left:36px; }
    .shutter-btn {
      width:32px; height:32px; border-radius:50%;
      background:transparent;
      border:2px solid rgba(108,192,74,0.7);
      color:rgba(108,192,74,0.9); font-size:0.8rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:0.15s;
    }
    .shutter-btn:hover { background:rgba(108,192,74,0.1); }
    .shutter-stop {
      width:28px; height:28px;
      border:2px solid rgba(255,255,255,0.7);
      background:transparent;
      border-radius:6px; cursor:pointer;
      transition:0.15s;
    }
    .shutter-stop:hover { background:rgba(255,255,255,0.08); }
    .shutter-pct { font-size:0.95rem; color:rgba(200,210,230,0.55); font-family:'Outfit',sans-serif; text-align:center; width:100px; }
    .shutter-slider { width:160px; accent-color:rgba(0,144,255,0.8); cursor:pointer; display:none; }

    .xp-topic-input { background:transparent; border:none; outline:none; color:rgba(180,210,255,0.8); font-size:0.58rem; font-family:'IBM Plex Mono',monospace; width:100%; min-width:0; }
    .xp-topic-select { background:transparent; border:none; outline:none; color:rgba(180,190,220,0.7); font-size:0.58rem; font-family:'Outfit'; width:100%; cursor:pointer; }
    .xp-dir-badge { padding:1px 4px; border-radius:4px; font-size:0.55rem; font-family:'IBM Plex Mono'; font-weight:700; text-align:center; cursor:pointer; }

    .xp-dir-badge.pub { background:rgba(108,192,74,0.15); color:var(--accent); border:1px solid rgba(108,192,74,0.3); }
    .xp-type-badge { padding:1px 4px; border-radius:4px; font-size:0.55rem; font-family:'IBM Plex Mono'; text-align:center; background:rgba(255,255,255,0.05); color:rgba(180,190,220,0.5); border:1px solid rgba(255,255,255,0.08); }
    .xp-type-badge.ana { background:rgba(251,191,36,0.1); color:#fbbf24; border-color:rgba(251,191,36,0.3); }

    /* Zone Traffic / Historique */

      display:flex; gap:6px; flex-shrink:0;
    }

      flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08);

    }
    .xp-log-list {

      display:flex; flex-direction:column; gap:2px;
    }

    .xp-log-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }

    .xp-log-entry { padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.03); line-height:1.4; }
    .xp-log-entry.tx { color:rgba(108,192,74,0.7); }
    .xp-log-entry.rx { color:rgba(0,144,255,0.7); }
    /* Séparateur */
    .xp-sep { height:1px; background:rgba(255,255,255,0.05); margin:2px 0; flex-shrink:0; }
       (déborde sur sidebar et statusbar via position:absolute; inset:0)
       Fond noir pur, étoiles ✦ jaunes générées par JS
       Lune en haut à gauche, koala + zzZ centrés, boutons ‹ › en bas
    ═══════════════════════════════════════════════════════════════ */
    .xd-veilleuse {
      /* Rendu normal dans xdContent, comme les autres écrans */
      position:relative; width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column;
      background:#000;
      overflow:hidden; gap:4px;
    }
    /* Mode veille plein écran : overlay par-dessus tout */
    .xd-veilleuse-overlay {
      position:absolute; inset:0; z-index:25;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column;
      background:#000;
      border-radius:8px; overflow:hidden; gap:4px;
      cursor:pointer;
    }
    .stars-container { position:absolute; inset:0; overflow:hidden; }
    .star {
      position:absolute; color:#f5c842;
      font-size:var(--sz,10px);
      animation:twinkle var(--dur,2s) ease-in-out infinite alternate;
      user-select:none;
    }
    .star::before { content:'✦'; }
    @keyframes twinkle { from { opacity:0.2; transform:scale(0.7); } to { opacity:1; transform:scale(1.1); } }
    /* Lune dorée en haut à gauche, grande */
    .veille-moon { font-size:2.8rem; z-index:2; position:absolute; top:8%; left:12%; transform:rotate(90deg); }
    /* Koala grand et centré — utilise l'emoji combo pour un rendu riche */
    .veille-koala { font-size:5.5rem; z-index:2; position:absolute; top:calc(50% - 35px); left:50%; transform:translateX(-50%); }
    /* zzZ en bleu ciel sous le koala */
    .veille-z { font-size:1.8rem; color:#38bdf8; z-index:2; font-style:italic; font-family:'Outfit'; font-weight:700; letter-spacing:3px; position:absolute; top:calc(50% - 55px); left:50%; transform:translateX(-50%); white-space:nowrap; width:60px; height:50px; }
    /* Boutons ‹ › centrés en bas, style cercle bleu */
    .veille-nav { display:flex; gap:40px; z-index:2; position:absolute; bottom:8%; left:50%; transform:translateX(-50%); }
    .veille-nav-btn {
      width:32px; height:32px; border-radius:50%;
      background:transparent;
      border:2px solid rgba(0,144,255,0.7);
      display:flex; align-items:center; justify-content:center;
      font-size:0.9rem; cursor:pointer; color:rgba(0,144,255,0.9);
      transition:0.2s;
    }
    .veille-nav-btn:hover { background:rgba(0,144,255,0.1); }
    .veille-koala { font-size:5.5rem; z-index:2; position:absolute; top:calc(50% - 35px); left:50%; transform:translateX(-50%); }
    .veille-z { font-size:1.8rem; color:#38bdf8; z-index:2; font-style:italic; font-family:'Outfit'; font-weight:700; letter-spacing:3px; position:absolute; top:calc(50% - 55px); left:50%; transform:translateX(-50%); white-space:nowrap; width:60px; height:50px; }

    /* ═══════════════════════════════════════════════════════════════
       ÉCRANS CAPTEURS : Température, Humidité, Luminosité
       xd-sensor      : conteneur centré
       sensor-ring    : grand cercle bleu 200×200px (style identique à l'interrupteur)
       sensor-icon-badge : icône 🌿 feuilles au-dessus de la valeur
       sensor-value   : valeur numérique principale (grande, blanche, gras)
       sensor-unit    : unité (°, %, Lux) affichée à droite de la valeur
    ═══════════════════════════════════════════════════════════════ */
    /* ============================================================
       CAPTEURS (temp/hum/lum) - grand cercle bleu, icône feuilles
    ============================================================ */
    .xd-sensor {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; height:100%; gap:0;
    }
    .sensor-ring {
      width:200px; height:200px; border-radius:50%;
      border:2.5px solid rgba(0,144,255,0.55);
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .sensor-icon-badge {
      position:absolute; top:38px; left:50%; transform:translateX(-50%);
      font-size:1.2rem;
    }
    .sensor-value { font-size:3.2rem; font-weight:300; color:white; font-family:'Inter',ui-sans-serif,sans-serif; line-height:1; }
    .sensor-unit { font-size:1rem; color:rgba(200,210,230,0.55); font-weight:400; margin-top:4px; font-family:'Outfit'; }
    .sensor-label { display:none; }

    /* ============================================================
       4 BOUTONS - fidèle capture (grille sombre, icônes blancs, barre bleue)
    ============================================================ */
    .xd-4btn {
      display:flex; align-items:center; justify-content:center;
      height:100%;
    }
    .btn4-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:3px; background:rgba(20,24,36,0.9); border-radius:18px; padding:8px;
      width:200px; height:200px;
    }
    .btn4-cell {
      background:rgba(20,24,36,0.9);
      border-radius:14px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:8px; cursor:pointer; transition:all 0.2s; padding:10px;
    }
    .btn4-cell:hover { background:rgba(40,46,64,0.9); }
    .btn4-icon { font-size:1.5rem; color:rgba(220,228,245,0.85); }
    .btn4-bar { width:36px; height:3px; border-radius:2px; background:rgba(255,255,255,0.08); }
    .btn4-cell.on .btn4-bar { background:#0090ff; }

    /* ============================================================
       SLIDER - fidèle capture (grand cercle bleu, +/- à droite, ampoule bas)
    ============================================================ */
    .xd-slider {
      display:flex; align-items:center; justify-content:center;
      height:100%; position:relative;
    }
    .slider-ring { width:175px; height:175px; position:relative; display:flex; align-items:center; justify-content:center; }
    .slider-ring svg { position:absolute; inset:0; width:100%; height:100%; }
    .slider-ring-inner { display:flex; flex-direction:column; align-items:center; z-index:1; }
    .slider-pct { font-size:1.8rem; font-weight:700; color:white; font-family:'Outfit'; line-height:1; }
    .slider-sub { display:none; }
    .slider-side { position:absolute; right:8px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:12px; }
    .slider-plus-btn, .slider-minus-btn {
      width:38px; height:38px; border-radius:8px;
      background:rgba(20,24,36,0.9);
      border:1px solid rgba(255,255,255,0.1);
      color:white; font-size:1.3rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:0.15s;
    }
    .slider-plus-btn { position:relative; top:-40px; }
    .slider-minus-btn { position:relative; top:40px; }
    .slider-plus-btn:hover, .slider-minus-btn:hover { background:rgba(40,46,64,0.9); }
    .slider-lamp { font-size:1.3rem; cursor:pointer; position:absolute; bottom:10px; left:50%; transform:translateX(-50%); }
    .slider-range { display:none; }

    /* ============================================================
       PLAYER - fidèle capture (carte arrondie, boutons ‹‹ ▶ ›› )
    ============================================================ */
    .xd-player {
      display:flex; flex-direction:column; justify-content:center;
      align-items:center; height:100%; position:relative;
    }
    .player-card {
      background:rgba(40,50,72,0.85);
      border-radius:18px; padding:14px 16px;
      width:230px; display:flex; flex-direction:column; gap:8px;
      margin-left:15px;
    }
    .player-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .player-track { font-size:0.95rem; font-weight:600; color:white; font-family:'Outfit'; text-align:center; }
    .player-artist { font-size:0.72rem; color:rgba(180,195,225,0.55); font-family:'Outfit'; text-align:center; }
    .player-vol-col { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
    .player-vol-icon { font-size:1rem; color:rgba(200,210,230,0.75); background:none; border:none; cursor:pointer; padding:0; margin-right:-5px; }
    .player-vol-btn { background:none; border:none; color:rgba(200,210,230,0.6); font-size:0.8rem; cursor:pointer; display:flex; align-items:center; white-space:nowrap; width:60px; height:50px; }
    .player-btns { display:flex; align-items:center; justify-content:center; gap:24px; }
    .player-btn {
      background:none; border:none;
      color:rgba(220,228,245,0.85); font-size:1.1rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:0.15s; width:28px; height:28px;
    }
    .player-btn:hover { color:white; }
    .player-btn.main { font-size:1.55rem; color:white; }
    .player-time-row { display:flex; align-items:center; justify-content:space-between; font-size:0.65rem; color:rgba(180,195,225,0.4); font-family:'IBM Plex Mono'; }
    .player-extras-row { display:flex; align-items:center; justify-content:space-between; }
    .player-extra-btn { background:none; border:none; color:rgba(200,210,230,0.45); font-size:0.85rem; cursor:pointer; }
    .player-vol-side { display:none; }
    .player-art, .player-progress, .player-vol-row { display:none; }

    /* Modale référence topics */
    .topics-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:1000; display:flex; align-items:center; justify-content:center; }
    .topics-modal { background:var(--panel); border:1px solid var(--border); border-radius:12px; width:min(820px,95vw); max-height:85vh; overflow:hidden; display:flex; flex-direction:column; }
    .topics-modal-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .topics-modal-header h3 { margin:0; font-size:0.95rem; color:white; }
    .topics-modal-body { overflow-y:auto; padding:12px 16px; flex:1; }
    .topics-modal h4 { font-size:0.8rem; color:var(--accent); margin:14px 0 4px; text-transform:uppercase; letter-spacing:0.06em; }
    .topics-modal p { font-size:0.75rem; color:var(--text-dim); margin:0 0 8px; }
    .topics-modal code { background:rgba(255,255,255,0.08); padding:1px 5px; border-radius:3px; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--accent2); }
    .topics-modal table { width:100%; border-collapse:collapse; font-size:0.72rem; margin-bottom:8px; }
    .topics-modal th { background:rgba(255,255,255,0.04); padding:5px 8px; text-align:left; color:var(--text-dim); border-bottom:1px solid var(--border); font-weight:600; }
    .topics-modal td { padding:4px 8px; border-bottom:1px solid rgba(255,255,255,0.04); color:rgba(220,228,245,0.8); font-family:'IBM Plex Mono',monospace; font-size:0.68rem; }
    .topics-modal td:first-child { color:rgba(180,195,225,0.65); }
    .section-note { font-size:0.68rem; color:rgba(180,195,225,0.4); margin:0 0 6px; font-style:italic; }
    .tag-pub { background:rgba(108,192,74,0.2); color:#6CC04A; border:1px solid rgba(108,192,74,0.3); border-radius:3px; padding:1px 5px; font-size:0.65rem; font-weight:700; white-space:nowrap; }
    .tag-sub { background:rgba(0,144,255,0.15); color:#0090ff; border:1px solid rgba(0,144,255,0.3); border-radius:3px; padding:1px 5px; font-size:0.65rem; font-weight:700; white-space:nowrap; }

    /* ============================================================
       KEYBOARD / ACCESS CONTROL - fidèle capture
    ============================================================ */
    .xd-keyboard {
      display:flex; flex-direction:column; height:100%; gap:8px;
      justify-content:center; padding:0 10px;
    }
    .keypad-display { display:none; }
    .keypad-grid {
      display:grid; grid-template-columns:repeat(3,42px); gap:8px;
      margin:0 auto;
    }
    .key-btn {
      background:#000;
      border:1px solid rgba(120,130,150,0.5);
      border-radius:10px; color:white; font-size:1.1rem;
      cursor:pointer; text-align:center;
      font-family:'Outfit'; font-weight:500; transition:0.12s;
      width:42px; height:42px;
      display:flex; align-items:center; justify-content:center;
    }
    .key-btn:hover { background:rgba(30,34,46,0.95); }
    .key-btn.enter { background:#000; border:1.5px solid rgba(108,192,74,0.7); color:white; font-size:0.65rem; }
    .key-btn.del { background:#000; border:1.5px solid rgba(224,82,82,0.7); color:white; font-size:0.65rem; }

    /* ============================================================
       XPOOL - fidèle capture (4 tuiles colorées + barre bottom)
    ============================================================ */
    .xd-xpool {
      display:flex; flex-direction:column; height:100%; gap:0;
      justify-content:flex-start; overflow:hidden;
    }
    .pool-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:6px; padding:8px 8px 4px; flex:1;
    }
    .pool-tile {
      border-radius:14px; padding:10px 12px;
      display:flex; flex-direction:column; gap:2px; position:relative;
    }
    .pool-tile-water { background:#1a7ec8; }
    .pool-tile-air { background:#1a5c3a; }
    .pool-tile-ph { background:#c8961a; }
    .pool-tile-orp { background:#8b3ac8; }
    .pool-tile-label { font-size:0.72rem; font-weight:600; color:rgba(255,255,255,0.85); font-family:'Outfit'; }
    .pool-tile-value { font-size:0.88rem; color:rgba(255,255,255,0.9); font-family:'Outfit'; font-weight:500; }
    .pool-tile-icon { position:absolute; top:8px; right:10px; font-size:0.9rem; opacity:0.7; }
    .pool-alert { margin:0 8px 4px; padding:5px 12px; background:rgba(40,44,58,0.9); border-radius:20px; text-align:right; font-size:0.7rem; color:rgba(220,228,245,0.7); font-family:'Outfit'; }
    .pool-bottom {
      display:flex; align-items:center; justify-content:space-around;
      padding:6px 8px; background:rgba(10,12,20,0.6);
      border-top:1px solid rgba(255,255,255,0.05);
    }
    .pool-bottom-btn {
      display:flex; flex-direction:column; align-items:center; gap:2px;
      font-size:1.1rem; cursor:pointer; padding:4px 8px; border-radius:8px; transition:0.15s;
      color:rgba(200,210,230,0.5);
    }
    .pool-bottom-btn.active { color:#0090ff; }
    .pool-bottom-btn:hover { background:rgba(255,255,255,0.04); }

    /* ============================================================
       MÉTÉO - fidèle capture (carte arrondie, prévisions 3 jours)
    ============================================================ */
    .xd-meteo { display:flex; align-items:center; justify-content:center; height:100%; }
    .meteo-card-outer {
      background:rgba(60,65,80,0.22);
      border-radius:18px;
      width:calc(100% - 35px); height:calc(100% - 35px);
      display:flex; flex-direction:column; justify-content:space-between;
      padding:6px 8px 4px; box-sizing:border-box; overflow:hidden;
      position:relative;
    }
    .meteo-top { display:flex; flex-direction:row; align-items:flex-start; justify-content:space-between; gap:6px; flex:1; }
    .meteo-top-left { display:flex; flex-direction:column; justify-content:flex-start; gap:4px; }
    .meteo-big-temp { font-size:2.6rem; font-weight:700; color:white; font-family:'Outfit'; line-height:1; }
    .meteo-sun-row { font-size:0.62rem; color:rgba(180,195,225,0.45); font-family:'IBM Plex Mono'; margin-top:2px; }
    .meteo-details-list { display:flex; flex-direction:column; gap:3px; margin-top:6px; }
    .meteo-detail-line { font-size:0.72rem; color:white; font-family:'Outfit'; display:flex; align-items:center; gap:4px; }
    .meteo-big-icon { font-size:3.8rem; line-height:1; }
    .meteo-divider { height:1px; background:rgba(255,255,255,0.07); margin:4px 0; }
    .meteo-forecast { display:flex; gap:4px; }
    .meteo-day {
      flex:1; background:rgba(60,65,80,0.6); border-radius:10px;
      padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .meteo-day-name { font-size:0.62rem; color:white; font-family:'IBM Plex Mono'; }
    .meteo-day-icon { font-size:1.3rem; }
    .meteo-day-temp { font-size:0.75rem; font-weight:600; color:white; font-family:'Outfit'; }

    /* ============================================================
       ÉNERGIE / CONSOMMATION - fidèle capture (4 cercles colorés)
    ============================================================ */
    /* ═══════════════════════════════════════════════════════════════
       ÉNERGIE / CONSOMMATION — 4 cercles en diamant
       Prod(haut) Soutiré(gauche) Conso(droite) Injection(bas)
       Cercles rendus sur canvas pour l'arc de progression
    ═══════════════════════════════════════════════════════════════ */
    .xd-energy { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .en-node { position:absolute; width:68px; height:68px; border-radius:50%; border:2.5px solid; background:rgba(0,0,0,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
    .en-icon { font-size:1.2rem; line-height:1; }
    .en-val { font-size:0.58rem; font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap; }
    .en-sub { font-size:0.52rem; font-family:'Outfit'; }
    .energy-arrows-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
      display:flex; align-items:center; justify-content:center;
      height:100%; position:relative;
    }
    .energy-diagram { position:relative; width:252px; height:240px; flex-shrink:0; }
    .energy-node {
      position:absolute;
      border-radius:50%; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:0px;
      width:84px; height:84px;
      border-width:4px; border-style:solid;
      background:#0d1017;
    }
    .energy-node-icon { font-size:1.25rem; line-height:1; margin-bottom:1px; }
    .energy-node-val { font-size:0.70rem; font-weight:700; color:white; font-family:'Outfit'; line-height:1.2; text-align:center; }
    .energy-node-sub { font-size:0.52rem; color:rgba(255,255,255,0.45); font-family:'Outfit'; }
    /* Positionnement diamant — nœud 84px, diagram 252×240 */
    /* centre X=126, centre Y=120 */
    .en-solar { top:0;    left:50%; transform:translateX(-50%); border-color:#f5a623; }
