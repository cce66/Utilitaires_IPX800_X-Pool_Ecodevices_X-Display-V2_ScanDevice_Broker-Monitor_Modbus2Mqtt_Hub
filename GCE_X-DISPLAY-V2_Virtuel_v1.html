    // ---------------------------------------------------------------------------
  // PERSISTANCE — Charge les écrans depuis localStorage au démarrage
  // ---------------------------------------------------------------------------
  function load(){
    
    let d = localStorage.getItem('xdv2_screens_v6') || localStorage.getItem('xdv2_screens_v5');
    
    if(d){ screens=JSON.parse(d).map(s=>{
      const scr = new DisplayScreen(s.id, s.name, s.type, s.association);
      // Fusionner les params : les valeurs par défaut en base, les valeurs sauvegardées par-dessus
      // Cela évite les erreurs si des champs ont été ajoutés après la sauvegarde
      if(s.params) {
        scr.params = Object.assign({}, scr.params, s.params);
        // Fusion profonde pour les sous-objets
        if(s.params.xpool)  scr.params.xpool  = Object.assign({}, scr.params.xpool,  s.params.xpool);
        if(s.params.meteo)  scr.params.meteo  = Object.assign({}, scr.params.meteo,  s.params.meteo);
        if(s.params.energy) scr.params.energy = Object.assign({}, scr.params.energy, s.params.energy);
        if(s.params.player) scr.params.player = Object.assign({}, scr.params.player, s.params.player);
        if(s.params.eco3)   scr.params.eco3   = Object.assign({}, scr.params.eco3,   s.params.eco3);
      }
      if(s.icon)    scr.icon    = s.icon;
      if(s.iconSvg) scr.iconSvg = s.iconSvg;
      return scr;
    }); if(!screens.length) addDefault(); }
    else addDefault();
    if(!screens.find(s=>s.id===selectedId)) selectedId=screens[0]?.id??0;
    
    
    initResizers();

    initMqttModeSelect();

    renderEditor();
    renderSimulator();


    if(localStorage.getItem('xdv2_screenPowerOn')!==null) screenPowerOn=localStorage.getItem('xdv2_screenPowerOn')==='true';
    if(localStorage.getItem('xdv2_screenLocked')!==null) screenLocked=localStorage.getItem('xdv2_screenLocked')==='true';
    if(localStorage.getItem('xdv2_mqttMode')) mqttMode = localStorage.getItem('xdv2_mqttMode');
    const modeSelect = document.getElementById('mqttModeSelect');
    if(modeSelect) modeSelect.value = mqttMode;
    
    updateGlobalUI();
  }
  
  
    // Crée un écran par défaut si aucun n'existe en mémoire
  function addDefault(){ screens=[new DisplayScreen(0,'Salon',0,'')]; selectedId=0; }
  
    // ---------------------------------------------------------------------------
  // GESTION ÉCRANS — Ajoute un nouvel écran avec paramètres par défaut
  // ---------------------------------------------------------------------------
  function addScreen(){
    const id = screens.length
      ? Math.max(...screens.map(s => s.id)) + 1
      : 0;

    screens.push(new DisplayScreen(id, `Écran ${id+1}`, 0, ''));
    selectedId = id;

    renderEditor();
    renderSimulator();
    save();
    publishScreenConfig();
  }
    
  
    // Supprime un écran par ID et sélectionne le premier restant
  function deleteScreen(id){
    if(screens.length<=1) return;
    // P1-6 : nettoyer l'interval du volet si actif pour cet écran (évite qu'un timer manipule un scr fantôme après suppression)
    if(shutterIntervals[id]){ clearInterval(shutterIntervals[id]); delete shutterIntervals[id]; }
    // Nettoyer aussi l'interval OWM du widget météo si actif
    stopOwmInterval(id);
    // Nettoyer l'override d'expansion (évite les orphelins dans localStorage)
    if(screenExpansion[id] !== undefined){ delete screenExpansion[id]; saveScreenExpansion(); }
    screens=screens.filter(s=>s.id!==id);
    if(selectedId===id) selectedId=screens[0].id;
    renderEditor(); renderSimulator(); save(); publishScreenConfig();
  }
    // ---------------------------------------------------------------------------
  // PARAMÈTRES — Modifie un paramètre d'écran via son chemin (ex: 'energy.prod')
  // Applique les validations de cohérence (énergie, sunrise/sunset…)
  // puis déclenche publishParamChange
  // ---------------------------------------------------------------------------
  function setParam(id, path, val){ let s=screens.find(x=>x.id===id); if(!s) return;
    // Validations cohérence écran Énergie
    if(s.params.energy){
      const e = s.params.energy;
      if(path==='energy.injecte'){
        // Injection ≤ Production
        val = Math.min(parseFloat(val)||0, e.prod||0);
        // Injection > 0 → Soutiré = 0
        if(parseFloat(val) > 0) e.soutire = 0;
      }
      if(path==='energy.soutire'){
        // Soutiré > 0 → Injection = 0
        if(parseFloat(val) > 0) e.injecte = 0;
      }
      if(path==='energy.charge'){
        // Charge > 0 → Décharge = 0
        if(parseFloat(val) > 0) e.decharge = 0;
      }
      if(path==='energy.decharge'){
        // Décharge > 0 → Charge = 0
        if(parseFloat(val) > 0) e.charge = 0;
      }
      if(path==='energy.prod'){
        // Production diminue → Injection ne peut pas dépasser la nouvelle production
        e.injecte = Math.min(e.injecte||0, parseFloat(val)||0);
      }
    }
    // Cas spéciaux sunrise/sunset heure et minute
    if(path==='meteo.sunrise.h'||path==='meteo.sunrise.m'){
      const parts=(s.params.meteo.sunrise||'08:00').split(':').map(Number);
      if(path==='meteo.sunrise.h') parts[0]=Math.max(0,Math.min(23,parseInt(val)||0));
      else parts[1]=Math.max(0,Math.min(59,parseInt(val)||0));
      s.params.meteo.sunrise=String(parts[0]).padStart(2,'0')+':'+String(parts[1]).padStart(2,'0');
      save(); publishParamChange(s,path,val); return;
    }
    if(path==='meteo.sunset.h'||path==='meteo.sunset.m'){
      const parts=(s.params.meteo.sunset||'20:30').split(':').map(Number);
      if(path==='meteo.sunset.h') parts[0]=Math.max(0,Math.min(23,parseInt(val)||0));
      else parts[1]=Math.max(0,Math.min(59,parseInt(val)||0));
      s.params.meteo.sunset=String(parts[0]).padStart(2,'0')+':'+String(parts[1]).padStart(2,'0');
      save(); publishParamChange(s,path,val); return;
    }
    // --- Bloc eco3 : intercepter AVANT le handler générique ---
    if(path.startsWith('eco3.')){
      const parts3=path.split('.');
      if(!s.params.eco3) s.params.eco3={tores:[0,0,0,0,0,0,0,0],toreNames:['Tore 1','Tore 2','Tore 3','Tore 4','Tore 5','Tore 6','Tore 7','Tore 8'],relay1:false,relay2:false,relayName1:'Relais 1',relayName2:'Relais 2',eauInst:0,eauIndex:0,eauPrix:0,gazInst:0,gazIndex:0,gazPrix:0,prodIndex:0,consoIndex:0};
      if(parts3[1]==='tores' && parts3[2]!==undefined){
        const idx=parseInt(parts3[2]);
        if(!Array.isArray(s.params.eco3.tores)) s.params.eco3.tores=[0,0,0,0,0,0,0,0];
        s.params.eco3.tores[idx]=Math.round(parseFloat(val)||0);
        save(); renderSimulator(); renderEditor(); return;
      }
      if(parts3[1]==='toreNames' && parts3[2]!==undefined){
        const idx=parseInt(parts3[2]);
        if(!Array.isArray(s.params.eco3.toreNames)) s.params.eco3.toreNames=['Tore 1','Tore 2','Tore 3','Tore 4','Tore 5','Tore 6','Tore 7','Tore 8'];
        s.params.eco3.toreNames[idx]=String(val).substring(0,12);
        save(); renderSimulator(); return;
      }
      if(parts3[1]==='relayName1'||parts3[1]==='relayName2'){
        s.params.eco3[parts3[1]]=String(val).substring(0,12);
        save(); renderSimulator(); return;
      }
      const numKey=parts3[1];
      if(numKey && s.params.eco3.hasOwnProperty(numKey)){
        s.params.eco3[numKey]=isNaN(val)?val:+val;
        save(); renderSimulator(); return;
      }
      return;
    }
    let parts=path.split('.'), obj=s.params; for(let i=0;i<parts.length-1;i++){ if(obj[parts[i]]===undefined) return; obj=obj[parts[i]]; } let last=parts[parts.length-1]; const strPaths=['poolId','poolId','association','name']; obj[last]=(strPaths.includes(last)||path==='xpool.poolId')?val:(isNaN(val)?val:+val); save(); publishParamChange(s,path,obj[last]); }

    // ---------------------------------------------------------------------------
  // MQTT PUBLISH — Traduit un changement de paramètre en topic MQTT
  // Calcule le bon topic selon le type d'écran et publie via pubMqttDirect
  // ---------------------------------------------------------------------------
  function publishParamChange(scr, path, val){
    const n=scr.id;
    if(path==='setpoint') pubMqttDirect(buildXDisplayTopic(n,'ThCmd'),val);
    if(path==='currentTemp') pubMqttDirect(buildXDisplayTopic(n,'ThMeasureCmd'),val);
    if(path==='thermoOn') pubMqttDirect(buildXDisplayTopic(n,'ThermoOnOff'),val?1:0);
    if(path==='thermoOutput') pubMqttDirect(buildXDisplayTopic(n,'ThermoOutput'),val?1:0);
    if(path==='ioState') pubMqttDirect(buildXDisplayTopic(n,'IoCmd'),val);
    if(path==='shutterPos') pubMqttDirect(buildXDisplayTopic(n,'ShutterPos'),val);
    if(path==='sensorVal'&&scr.type===6) pubMqttDirect(buildXDisplayTopic(n,'tempCmd'),val);
    if(path==='sensorVal'&&scr.type===7) pubMqttDirect(buildXDisplayTopic(n,'humCmd'),val);
    if(path==='sensorVal'&&scr.type===8) pubMqttDirect(buildXDisplayTopic(n,'lumCmd'),val);
    if(path==='sliderVal') pubMqttDirect(buildXDisplayTopic(n,'SliderValueCmd'),val);
    if(path==='sliderBtn') pubMqttDirect(buildXDisplayTopic(n,'SliderBtnCmd'),val);
    if(path.startsWith('xpool.')){let sub=path.split('.')[1];
      if(sub==='poolId'){ mqttConfig.xpoolId=val; localStorage.setItem('xdisp_mqttConfig',JSON.stringify(mqttConfig)); const el=document.getElementById('xpXpoolId'); if(el) el.value=val; const tr=document.getElementById('xpXpoolTopicRoot'); if(tr) tr.value='x-pool_'+val; return; }
      if(sub==='waterTemp') poolPub(scr,`ana/eau`,val);
      if(sub==='airTemp') poolPub(scr,`ana/air`,val);
      if(sub==='ph') poolPub(scr,`ana/ph`,val);
      if(sub==='orp') poolPub(scr,`ana/redox`,val);
      if(sub==='filtration') poolPub(scr,`outCmd/filtration`,val?1:0);
      if(sub==='heating') poolPub(scr,`outCmd/heater`,val?1:0);
      if(sub==='light') poolPub(scr,`outCmd/light`,val?1:0);
      if(sub==='aux') poolPub(scr,`outCmd/aux`,val?1:0);
    }
    if(path.startsWith('meteo.')){let sub=path.split('.')[1];
      if(sub==='temp') pubMqttDirect(buildXDisplayTopic(n,'Whtemp'),val);
      if(sub==='humidity') pubMqttDirect(buildXDisplayTopic(n,'Wthum'),val);
      if(sub==='wind') pubMqttDirect(buildXDisplayTopic(n,'Whwind'),val);
      if(sub==='pressure') pubMqttDirect(buildXDisplayTopic(n,'WhPressure'),val);
      if(sub==='sunrise'||path==='meteo.sunrise.h'||path==='meteo.sunrise.m'){
        pubMqttDirect(buildXDisplayTopic(n,'WhSunrise'),scr.params.meteo.sunrise);
      }
      if(sub==='sunset'||path==='meteo.sunset.h'||path==='meteo.sunset.m'){
        pubMqttDirect(buildXDisplayTopic(n,'WhSunset'),scr.params.meteo.sunset);
      }
      if(sub==='level') pubMqttDirect(buildXDisplayTopic(n,'WhLevel'),val);
    }
    if(path.startsWith('energy.')){let sub=path.split('.')[1];
      if(sub==='conso') pubMqttDirect(buildXDisplayTopic(n,'Consommation'),val);
      if(sub==='prod') pubMqttDirect(buildXDisplayTopic(n,'Production'),val);
      if(sub==='charge') pubMqttDirect(buildXDisplayTopic(n,'Charge'),val);
      if(sub==='decharge') pubMqttDirect(buildXDisplayTopic(n,'Discharge'),val);
      if(sub==='soutire') pubMqttDirect(buildXDisplayTopic(n,'Soutire'),val);
      if(sub==='injecte') pubMqttDirect(buildXDisplayTopic(n,'Injecte'),val);
    }
    if(path.startsWith('btnStates.')){let idx=path.split('.')[1]; pubMqttDirect(buildXDisplayTopic(n,`IoBtn${parseInt(idx)+1}Cmd`),val);}
    if(path==='player.serverIp') pubMqttDirect(buildXDisplayTopic(n,'PlayerServerIP'),val,true); // retained
    // Publier aussi les topics d'état (SUB) retained à chaque changement
    publishScreenState(scr);
  }

    // ---------------------------------------------------------------------------
  // MQTT — Publie un message sur un topic complet
  // En mode local : simule la réception (onMessageArrived)
  // En mode connecté : publie via le client Paho
  // ---------------------------------------------------------------------------
  function pubMqttDirect(topic,val,retained){ 
    if(mqttMode === 'local'){
      // En mode local : on simule la réception du message pour mettre à jour le simulateur
      addTrafficMessage('LOCAL',topic,String(val));
      onMessageArrived({destinationName: topic, payloadString: String(val)});
      return;
    }
    if(!mqttClient||!mqttClient.isConnected()||mqttMode === 'rxonly') return;
    let msg=new Paho.MQTT.Message(String(val)); 
    msg.destinationName=topic;
    if(retained) msg.retained=true;
    mqttClient.send(msg); 
    addTrafficMessage(retained?'PUB®':'PUB',topic,String(val)); 
  }

  // Publie l'état courant d'UN écran (topics SUB, retained)
  function publishScreenState(scr){
    if(!mqttClient||!mqttClient.isConnected()||mqttMode==='rxonly') return;
    const n=scr.id, p=scr.params, t=scr.type, R=true;
    switch(t){
      case 0:
        pubMqttDirect(buildXDisplayTopic(n,'ThState'), p.setpoint||20, R);
        pubMqttDirect(buildXDisplayTopic(n,'ThMeasureState'), p.currentTemp||20, R);
        pubMqttDirect(buildXDisplayTopic(n,'ThCmdReply'), p.setpoint||20, R);
        break;
      case 1: case 2:
        pubMqttDirect(buildXDisplayTopic(n,'IoState'), p.ioState||0, R);
        break;
      case 3:
        pubMqttDirect(buildXDisplayTopic(n,'ShutterPos'), p.shutterPos||0, R);
        break;
      case 6: pubMqttDirect(buildXDisplayTopic(n,'temp'), p.sensorVal||0, R); break;
      case 7: pubMqttDirect(buildXDisplayTopic(n,'hum'), p.sensorVal||0, R); break;
      case 8: pubMqttDirect(buildXDisplayTopic(n,'lum'), p.sensorVal||0, R); break;
      case 9:
        const bs=p.btnStates||[0,0,0,0];
        for(let i=0;i<4;i++) pubMqttDirect(buildXDisplayTopic(n,`IoBtn${i+1}State`), bs[i]||0, R);
        break;
      case 10:
        pubMqttDirect(buildXDisplayTopic(n,'SliderValueState'), p.sliderVal||0, R);
        pubMqttDirect(buildXDisplayTopic(n,'SliderBtnState'), p.sliderBtn||0, R);
        break;
      case 11:
        const pl=p.player||{};
        pubMqttDirect(buildXDisplayTopic(n,'PlayerMuteState'), pl.muted?1:0, R);
        pubMqttDirect(buildXDisplayTopic(n,'PlayerPauseState'), pl.paused?1:0, R);
        pubMqttDirect(buildXDisplayTopic(n,'PlayerRandomState'), pl.random?1:0, R);
        pubMqttDirect(buildXDisplayTopic(n,'PlayerLoopState'), pl.loop||0, R);
        if(pl.serverIp) pubMqttDirect(buildXDisplayTopic(n,'PlayerServerIP'), pl.serverIp, R);
        break;
    }
  }

  // Publie la configuration complète + état courant de tous les écrans (retained)
  function publishScreenConfig(){
    if(!mqttClient||!mqttClient.isConnected()||mqttMode==='rxonly') return;
    const R=true;
    pubMqttDirect(buildXDisplayRootTopic('NbScreen'), screens.length, R);
    pubMqttDirect(buildXDisplayRootTopic('temp'), 24.2, R);
    screens.forEach(scr=>{
      pubMqttDirect(buildXDisplayTopic(scr.id,'ScreenType'), scr.type, R);
      pubMqttDirect(buildXDisplayTopic(scr.id,'ScreenName'), scr.name, R);
      pubMqttDirect(buildXDisplayTopic(scr.id,'ScreenAssociation'), scr.association||'', R);
      publishScreenState(scr);
    });
    addLog(`📡 Config + état publiés : ${screens.length} écran(s) sur ${buildXDisplayRootTopic('')}`);
  }
  
  
  
  // ═══════════════════════════════════════════════════════════════
  //  P1-5 : HELPERS DE CONSTRUCTION DE TOPICS MQTT
  //  Centralise les conventions `x-display_<devId>/[scrId/]<key>` et
  //  `x-pool_<poolId>/<key>` pour qu'un changement futur ne touche qu'ici.
  // ═══════════════════════════════════════════════════════════════
  function buildXDisplayTopic(scrId, key, devId){
    const dev = devId || document.getElementById('deviceId').value || mqttConfig.deviceId || '000001';
    return `x-display_${dev}/${scrId}/${key}`;
  }
  function buildXDisplayRootTopic(key, devId){
    const dev = devId || document.getElementById('deviceId').value || mqttConfig.deviceId || '000001';
    return key ? `x-display_${dev}/${key}` : `x-display_${dev}`;
  }
  function buildPoolTopic(poolId, key){
    return key ? `x-pool_${poolId}/${key}` : `x-pool_${poolId}`;
  }

    // Publie vers x-display_<ID>/<n°écran>/<topic> (raccourci)
  function pubMqtt(scr,topic,val){ pubMqttDirect(buildXDisplayTopic(scr.id, topic), val); }
    // Retourne l'ID du X-Pool associé à un écran Xpool
  function getPoolId(scr){ return (scr&&scr.params&&scr.params.xpool&&scr.params.xpool.poolId)||mqttConfig.xpoolId||'000001'; }
    // Publie une commande vers le X-Pool : x-pool_<ID>/<path>
  function poolPub(scr,path,val){ pubMqttDirect(buildPoolTopic(getPoolId(scr), path), val); }

  // ═══════════════════════════════════════════════════════════════
  //  INTÉGRATION OPENWEATHERMAP — simule le module Météo IPX800 V5
  //  Fetch OWM One Call 3.0 → publie sur les topics x-display MQTT retained
  //  Le widget écoute déjà ces topics via onMessageArrived — mêmes chemins de données
  // ═══════════════════════════════════════════════════════════════
  const owmIntervals = {}; // {scrId: intervalId}

  // Convertit un code condition OpenWeatherMap (id) vers l'échelle WhLevel du X-Display (0-6)
  // Réf : https://openweathermap.org/weather-conditions
  function mapOwmIdToWhLevel(id){
    if(!id) return 0;
    if(id>=200 && id<300) return 5; // Thunderstorm
    if(id>=300 && id<400) return 4; // Drizzle
    if(id>=500 && id<600) return 4; // Rain
    if(id>=600 && id<700) return 6; // Snow
    if(id>=700 && id<800) return 3; // Atmosphere (mist/fog/haze/smoke/dust)
    if(id===800) return 0;           // Clear
    if(id===801 || id===802) return 1; // few/scattered clouds → éclaircie
    if(id===803 || id===804) return 2; // broken/overcast → nuage
    return 2;
  }

  // Fetch OWM One Call 3.0 puis publie sur les topics MQTT du X-Display
  // Cache : quelle version d'API a fonctionné pour chaque écran (évite de retenter 3.0 à chaque cycle)
  // Réinitialisé quand la clé API change (voir handler dans renderEditor)
  const owmApiVersion = {}; // scrId → '3.0' | '2.5' | undefined (jamais tenté)

  // === Tentative API 3.0 One Call ===
  // Retourne { data } en cas de succès, { fallback:true } sur 401 (déclenche la bascule 2.5)
  // Throw sur autre erreur (réseau, 500, etc.)
  async function tryFetchOwm3(owm){
    const url = `https://api.openweathermap.org/data/3.0/onecall?lat=${owm.lat}&lon=${owm.lon}&appid=${encodeURIComponent(owm.apiKey)}&units=metric&lang=fr&exclude=minutely,hourly,alerts`;
    const resp = await fetch(url);
    if(resp.status === 401) return { fallback:true, reason:'abonnement One Call by Call requis' };
    if(!resp.ok) throw new Error(`API 3.0 HTTP ${resp.status} ${resp.statusText}`);
    return { data: parseOwm3(await resp.json()) };
  }

  // === Tentative API 2.5 (weather + forecast en parallèle) ===
  async function tryFetchOwm25(owm){
    const base = `lat=${owm.lat}&lon=${owm.lon}&appid=${encodeURIComponent(owm.apiKey)}&units=metric&lang=fr`;
    const [wResp, fResp] = await Promise.all([
      fetch(`https://api.openweathermap.org/data/2.5/weather?${base}`),
      fetch(`https://api.openweathermap.org/data/2.5/forecast?${base}`)
    ]);
    if(!wResp.ok) throw new Error(`API 2.5 weather HTTP ${wResp.status}`);
    if(!fResp.ok) throw new Error(`API 2.5 forecast HTTP ${fResp.status}`);
    return parseOwm25(await wResp.json(), await fResp.json());
  }

  // === Parseurs vers structure commune { current, forecasts[3] } ===
  function parseOwm3(data){
    const cur = data.current || {};
    const curW = (cur.weather && cur.weather[0]) || {};
    const daily = data.daily || [];
    return {
      current: {
        temp: Math.round(cur.temp*10)/10, humidity: cur.humidity,
        wind_kmh: Math.round((cur.wind_speed||0)*3.6), pressure: cur.pressure,
        level: mapOwmIdToWhLevel(curW.id),
        sunrise_ts: cur.sunrise, sunset_ts: cur.sunset
      },
      forecasts: [1,2,3].map(i => {
        const d = daily[i]; if(!d) return null;
        const dW = (d.weather && d.weather[0]) || {};
        return { temp: Math.round((d.temp && d.temp.day)||0), level: mapOwmIdToWhLevel(dW.id) };
      })
    };
  }

  function parseOwm25(wData, fData){
    const wW = (wData.weather && wData.weather[0]) || {};
    const list = fData.list || [];
    // Pour chaque J+1, J+2, J+3 : trouver l'entrée du forecast la plus proche de midi ce jour-là
    const today = new Date(); today.setHours(0,0,0,0);
    const forecasts = [1,2,3].map(offset => {
      const target = new Date(today); target.setDate(today.getDate() + offset);
      const dayEntries = list.filter(e => {
        const d = new Date(e.dt * 1000);
        return d.getFullYear()===target.getFullYear() && d.getMonth()===target.getMonth() && d.getDate()===target.getDate();
      });
      if(dayEntries.length === 0) return null;
      // Créneau le plus proche de 12h locale
      let best = dayEntries[0], bestDiff = 24;
      for(const e of dayEntries){
        const diff = Math.abs(new Date(e.dt*1000).getHours() - 12);
        if(diff < bestDiff){ bestDiff = diff; best = e; }
      }
      const w = (best.weather && best.weather[0]) || {};
      return { temp: Math.round(best.main.temp), level: mapOwmIdToWhLevel(w.id) };
    });
    return {
      current: {
        temp: Math.round((wData.main.temp||0)*10)/10, humidity: wData.main.humidity,
        wind_kmh: Math.round(((wData.wind && wData.wind.speed)||0)*3.6), pressure: wData.main.pressure,
        level: mapOwmIdToWhLevel(wW.id),
        sunrise_ts: wData.sys && wData.sys.sunrise, sunset_ts: wData.sys && wData.sys.sunset
      },
      forecasts
    };
  }

  // === Publish sur MQTT (retained) à partir de la structure commune ===
  function publishOwmWeather(scr, wd){
    const R = true, c = wd.current;
    pubMqttDirect(buildXDisplayTopic(scr.id,'Whtemp'), c.temp, R);
    pubMqttDirect(buildXDisplayTopic(scr.id,'Wthum'), c.humidity, R);
    pubMqttDirect(buildXDisplayTopic(scr.id,'Whwind'), c.wind_kmh, R);
    pubMqttDirect(buildXDisplayTopic(scr.id,'WhPressure'), c.pressure, R);
    pubMqttDirect(buildXDisplayTopic(scr.id,'WhLevel'), c.level, R);
    const fmtHM = ts => { const d = new Date(ts*1000); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
    if(c.sunrise_ts) pubMqttDirect(buildXDisplayTopic(scr.id,'WhSunrise'), fmtHM(c.sunrise_ts), R);
    if(c.sunset_ts)  pubMqttDirect(buildXDisplayTopic(scr.id,'WhSunset'),  fmtHM(c.sunset_ts),  R);
    for(let i=1; i<=3; i++){
      const f = wd.forecasts[i-1]; if(!f) continue;
      pubMqttDirect(buildXDisplayTopic(scr.id,`WhtempD${i}`), f.temp, R);
      pubMqttDirect(buildXDisplayTopic(scr.id,`WhLevelD${i}`), f.level, R);
    }
  }

  // === Orchestrateur : tente 3.0 puis 2.5 (avec cache par écran) ===
  async function fetchOwmAndPublish(scr){
    const owm = scr.params.meteo && scr.params.meteo.owm;
    if(!owm || !owm.apiKey){ addLog(`OWM #${scr.id} : clé API manquante`, true); return; }
    if(!mqttClient || !mqttClient.isConnected()){ addLog(`OWM #${scr.id} : MQTT non connecté`, true); return; }
    try {
      const preferredVersion = owmApiVersion[scr.id] || '3.0';
      let weatherData;
      if(preferredVersion === '3.0'){
        const result = await tryFetchOwm3(owm);
        if(result.fallback){
          addLog(`OWM #${scr.id} : API 3.0 refusée (${result.reason}), bascule sur API 2.5 gratuite`);
          owmApiVersion[scr.id] = '2.5';
          weatherData = await tryFetchOwm25(owm);
        } else {
          owmApiVersion[scr.id] = '3.0';
          weatherData = result.data;
        }
      } else {
        weatherData = await tryFetchOwm25(owm);
      }
      publishOwmWeather(scr, weatherData);
      addLog(`🌦️ OWM #${scr.id} : publié (API ${owmApiVersion[scr.id]})`);
    } catch(e){
      addLog(`OWM #${scr.id} : ${e.message}`, true);
    }
  }

  // Démarre l'auto-refresh OWM pour un écran (arrête l'ancien si présent)
  function startOwmInterval(scr){
    stopOwmInterval(scr.id);
    const owm = scr.params.meteo && scr.params.meteo.owm;
    if(!owm || owm.useIpx800v5) return; // mode IPX800 : rien à faire
    const minutes = Math.max(1, Math.min(60, parseInt(owm.refreshMin)||10));
    fetchOwmAndPublish(scr); // premier fetch immédiat
    owmIntervals[scr.id] = setInterval(()=>fetchOwmAndPublish(scr), minutes*60*1000);
  }

  // Arrête l'auto-refresh OWM pour un écran
  function stopOwmInterval(scrId){
    if(owmIntervals[scrId]){ clearInterval(owmIntervals[scrId]); delete owmIntervals[scrId]; }
  }

  // (Re)démarre tous les intervals OWM des écrans météo en mode simulé
  function refreshAllOwmIntervals(){
    screens.forEach(scr=>{
      if(scr.type===14 && scr.params.meteo && scr.params.meteo.owm && !scr.params.meteo.owm.useIpx800v5){
        startOwmInterval(scr);
      } else {
        stopOwmInterval(scr.id);
      }
    });
  }

  /* ============ RENDER EDITOR ============ */
    // ---------------------------------------------------------------------------
  // RENDU ÉDITEUR — Redessine le panneau gauche (cartes d'écrans + paramètres)
  // ---------------------------------------------------------------------------
  function renderEditor(){
    let cont=document.getElementById('screenList'); cont.innerHTML='';
    screens.forEach(scr=>{
      let card=document.createElement('div');
      card.className=`screen-card ${selectedId===scr.id?'selected':''}`;
      // L'ancien onclick global est retiré : la sélection se fait maintenant via le click sur le header
      // (voir handler ci-dessous qui combine toggle expansion + sélection)
      const expanded = isScreenExpanded(scr.id);
      const chevron = expanded ? '▼' : '▶';
      const detailsStyle = expanded ? '' : ' style="display:none;"';
      card.innerHTML=`<div class="card-header"><span class="card-chevron">${chevron}</span><span class="card-num">${scr.id}</span><input type="text" value="${escH(scr.name)}" data-name><select class="type-select">${Object.entries(SCREEN_TYPES).sort((a,b)=>a[1].localeCompare(b[1],'fr')).map(([v,l])=>`<option value="${v}"${scr.type==v?' selected':''}>${l}</option>`).join('')}</select><button class="delete-btn">✕</button></div><div class="card-details" id="det-${scr.id}"${detailsStyle}>${renderParams(scr)}</div>`;
      cont.appendChild(card);
      // Click sur le header (hors inputs/select/delete) → toggle expansion + sélectionne si nouvellement déplié
      card.querySelector('.card-header').addEventListener('click', e=>{
        if(e.target.closest('input,select,.delete-btn,.shutter-ctrl-btn')) return;
        const nowExpanded = !isScreenExpanded(scr.id);
        screenExpansion[scr.id] = nowExpanded;
        saveScreenExpansion();
        if(nowExpanded) selectedId = scr.id; // déplier une carte = la sélectionner
        renderEditor();
        renderSimulator();
      });
      card.querySelector('[data-name]').addEventListener('change',e=>{ scr.name=e.target.value.substring(0,15); renderSimulator(); save(); publishScreenConfig(); });
      card.querySelector('.type-select').addEventListener('change',e=>{ scr.type=+e.target.value; renderEditor(); renderSimulator(); save(); publishScreenConfig(); });
      card.querySelector('.delete-btn').addEventListener('click',e=>{ e.stopPropagation(); deleteScreen(scr.id); });
      card.querySelectorAll('[data-param]').forEach(el=>el.addEventListener('change',e=>setParam(scr.id,e.target.dataset.param,e.target.value)));
      card.querySelectorAll('[data-param-live]').forEach(el=>el.addEventListener('input',e=>setParam(scr.id,e.target.dataset.paramLive,e.target.value)));
      // === Handlers OWM (widget météo) ===
      const owmUseIpx = card.querySelector(`#owmUseIpx_${scr.id}`);
      if(owmUseIpx){
        owmUseIpx.addEventListener('change', e=>{
          if(!scr.params.meteo.owm) scr.params.meteo.owm = { useIpx800v5:true, apiKey:'', lat:48.8566, lon:2.3522, refreshMin:10 };
          scr.params.meteo.owm.useIpx800v5 = e.target.checked;
          save();
          renderEditor();
          if(scr.params.meteo.owm.useIpx800v5) stopOwmInterval(scr.id);
          else startOwmInterval(scr);
        });
        const owmApiKey = card.querySelector(`#owmApiKey_${scr.id}`);
        const owmLat    = card.querySelector(`#owmLat_${scr.id}`);
        const owmLon    = card.querySelector(`#owmLon_${scr.id}`);
        const owmRefr   = card.querySelector(`#owmRefreshMin_${scr.id}`);
        const owmBtn    = card.querySelector(`#owmFetchNow_${scr.id}`);
        if(owmApiKey) owmApiKey.addEventListener('change', e=>{ scr.params.meteo.owm.apiKey = e.target.value.trim(); delete owmApiVersion[scr.id]; save(); startOwmInterval(scr); });
        if(owmLat)    owmLat.addEventListener('change',    e=>{ scr.params.meteo.owm.lat = parseFloat(e.target.value)||0; save(); startOwmInterval(scr); });
        if(owmLon)    owmLon.addEventListener('change',    e=>{ scr.params.meteo.owm.lon = parseFloat(e.target.value)||0; save(); startOwmInterval(scr); });
        if(owmRefr)   owmRefr.addEventListener('change',   e=>{ scr.params.meteo.owm.refreshMin = Math.max(1, Math.min(60, parseInt(e.target.value)||10)); save(); startOwmInterval(scr); });
        if(owmBtn)    owmBtn.addEventListener('click',     e=>{ e.stopPropagation(); fetchOwmAndPublish(scr); });
      }
      card.querySelectorAll('.shutter-ctrl-btn').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); const cmd=parseInt(btn.dataset.shutterCmd); pubMqttDirect(buildXDisplayTopic(scr.id,'ShutterCmd'),cmd); }));
      card.querySelectorAll('[data-toggle-param]').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); const param=btn.dataset.toggleParam;
        if(param==='thermoOn'){ scr.params.thermoOn=!scr.params.thermoOn; pubMqttDirect(buildXDisplayTopic(scr.id,'ThermoOnOff'),scr.params.thermoOn?1:0); }
        else if(param==='thermoOutput'){ scr.params.thermoOutput=!scr.params.thermoOutput; pubMqttDirect(buildXDisplayTopic(scr.id,'ThermoOutput'),scr.params.thermoOutput?1:0); }
        else if(param==='ioState'){ scr.params.ioState=scr.params.ioState==1?0:1; pubMqttDirect(buildXDisplayTopic(scr.id,'IoCmd'),scr.params.ioState); publishScreenState(scr); }
        else if(param==='sliderBtn'){ scr.params.sliderBtn=scr.params.sliderBtn==1?0:1; pubMqttDirect(buildXDisplayTopic(scr.id,'SliderBtnCmd'),scr.params.sliderBtn); publishScreenState(scr); }
        else if(param==='eco3.relay1'){ if(!scr.params.eco3) scr.params.eco3={}; scr.params.eco3.relay1=!scr.params.eco3.relay1; save(); renderSimulator(); renderEditor(); }
        else if(param==='eco3.relay2'){ if(!scr.params.eco3) scr.params.eco3={}; scr.params.eco3.relay2=!scr.params.eco3.relay2; save(); renderSimulator(); renderEditor(); }
      }));
      // Boutons commande relais EcoDevices 3
      card.querySelectorAll('[data-eco3-relay-cmd]').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation();
        const n=parseInt(btn.dataset.eco3RelayCmd);
        if(!scr.params.eco3) scr.params.eco3={};
        const key='relay'+n;
        scr.params.eco3[key]=!scr.params.eco3[key];
        const ecoName=mqttConfig.ecodevicesName||'';
        if(ecoName) pubMqttDirect(`${ecoName}/relay_cmd/${n}`, scr.params.eco3[key]?1:0);
        save(); renderSimulator(); renderEditor();
      }));
      card.querySelectorAll('[data-btn4-toggle]').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); const i=parseInt(btn.dataset.btn4Toggle); scr.params.btnStates[i]=scr.params.btnStates[i]==1?0:1; pubMqttDirect(buildXDisplayTopic(scr.id,`IoBtn${i+1}Cmd`),scr.params.btnStates[i]); publishScreenState(scr); }));
      card.querySelectorAll('[data-player-cmd]').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); const cmd=btn.dataset.playerCmd; const pl=scr.params.player;
        const flashBtn=(btn)=>{ btn.style.animation='none'; btn.offsetHeight; btn.style.animation='btn-flash 0.1s ease-out forwards'; };
        if(cmd==='PlayerPauseCmd'){ pl.paused=!pl.paused; pubMqttDirect(buildXDisplayTopic(scr.id,cmd),pl.paused?1:0); publishScreenState(scr); }
        else if(cmd==='PlayerMuteCmd'){ pl.muted=!pl.muted; pubMqttDirect(buildXDisplayTopic(scr.id,cmd),pl.muted?1:0); publishScreenState(scr); }
        else if(cmd==='PlayerRandomCmd'){ pl.random=!pl.random; pubMqttDirect(buildXDisplayTopic(scr.id,cmd),pl.random?1:0); publishScreenState(scr); }
        else if(cmd==='PlayerLoopCmd'){ pl.loop=(pl.loop+1)%3; pubMqttDirect(buildXDisplayTopic(scr.id,cmd),pl.loop); publishScreenState(scr); }
        else { flashBtn(btn); setTimeout(()=>pubMqttDirect(buildXDisplayTopic(scr.id,cmd),1), 100); }
      }));
      card.querySelectorAll('[data-param="xpool.poolId"]').forEach(el=>el.addEventListener('input',e=>{
        const topicSpan=el.closest('.card-details')?.querySelector('.xpool-topic-racine');
        if(topicSpan) topicSpan.textContent='x-pool_'+e.target.value+'/#';
      }));
      card.querySelectorAll('[data-xpool-cmd]').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); const cmd=btn.dataset.xpoolCmd; const xp=scr.params.xpool;
        if(cmd==='FiltrationState'){ xp.filtration=!xp.filtration; poolPub(scr,`outCmd/filtration`,xp.filtration?1:0); }
        else if(cmd==='HeatherState'){ xp.heating=!xp.heating; poolPub(scr,`outCmd/heater`,xp.heating?1:0); }
        else if(cmd==='LightState'){ xp.light=!xp.light; poolPub(scr,`outCmd/light`,xp.light?1:0); }
        else if(cmd==='AuxState'){ xp.aux=!xp.aux; poolPub(scr,`outCmd/aux`,xp.aux?1:0); }
        else if(['unph','upph','unorp','uporp'].includes(cmd)){
          if(!xp.notif) xp.notif={unph:false,upph:false,unorp:false,uporp:false};
          xp.notif[cmd]=!xp.notif[cmd];
          if(cmd==='unph' && xp.notif.unph)  xp.notif.upph=false;
          if(cmd==='upph' && xp.notif.upph)  xp.notif.unph=false;
          if(cmd==='unorp' && xp.notif.unorp) xp.notif.uporp=false;
          if(cmd==='uporp' && xp.notif.uporp) xp.notif.unorp=false;
          poolPub(scr,`notif/${cmd}`,xp.notif[cmd]?1:0);
        }
      }));
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     MOTEUR DE RENDU PRINCIPAL DU SIMULATEUR (renderSimulator)
     Appelée à chaque changement d'écran, de valeur ou d'overlay
     1. Met à jour le nom de l'écran dans la statusbar
     2. Reconstruit les boutons de la sidebar (icônes, numéros, actif)
     3. Si un overlay est actif (iconpicker/config/code) → renderOverlay()
     4. Sinon → renderScreenContent() + bindScreenEvents()
     5. Pour le thermostat → updateThermoVisual() → drawThermoCanvas()
  ═══════════════════════════════════════════════════════════════ */
  /* ============ RENDER SIMULATOR ============ */
    // ---------------------------------------------------------------------------
  // RENDU SIMULATEUR — Met à jour l'écran virtuel central
  // ---------------------------------------------------------------------------
  function renderSimulator(){
    const scr=screens.find(s=>s.id===selectedId); if(!scr) return;
    document.getElementById('xdScreenNameBar').textContent=scr.name;
    const wrap=document.getElementById('xdNavIconsWrap');
    wrap.innerHTML='';
    // Ajuster navOffset pour que l'écran sélectionné soit toujours visible
    const selIdx=screens.findIndex(s=>s.id===selectedId);
    if(selIdx>=0){ navOffset=Math.min(navOffset,selIdx); navOffset=Math.max(navOffset,selIdx-2); navOffset=Math.max(0,Math.min(navOffset,screens.length-3)); }
    screens.slice(navOffset,navOffset+3).forEach((s,i)=>{
      const ic=document.createElement('div');
      ic.className=`xd-nav-icon ${s.id===selectedId?'active':''}`;
      ic.innerHTML=(s.iconSvg||NAV_ICONS[s.type]||NAV_ICONS[1])+`<span class="nav-num">${navOffset+i+1}</span>`;
      ic.dataset.navId=s.id;
      ic.onclick=()=>{ selectedId=s.id; xdOverlayMode=null; renderSimulator(); renderEditor(); };
      wrap.appendChild(ic);
    });
    document.getElementById('navUp').onclick=()=>{ const idx=screens.findIndex(s=>s.id===selectedId); if(idx>0){ selectedId=screens[idx-1].id; xdOverlayMode=null; renderSimulator(); renderEditor(); } };
    document.getElementById('navDown').onclick=()=>{ const idx=screens.findIndex(s=>s.id===selectedId); if(idx+1<screens.length){ selectedId=screens[idx+1].id; xdOverlayMode=null; renderSimulator(); renderEditor(); } };
    // Si un overlay est actif, on le réaffiche
    if(xdOverlayMode){ renderOverlay(); return; }
    // Nettoyer toute veilleuse plein-écran résiduelle (mode veille)
    const surface=document.getElementById('xdScreenSurface');
    surface.querySelectorAll('.xd-veilleuse-overlay').forEach(el=>el.remove());
    const content=document.getElementById('xdContent');
    content.innerHTML=renderScreenContent(scr);
    bindScreenEvents(scr,content);
    if(scr.type===0) updateThermoVisual(scr);
    updateScreenAppearance();
  }

    // Génère le contenu HTML de l'écran selon son type
  function renderScreenContent(scr){
    const p=scr.params;
    switch(scr.type){
      case 0:  return renderThermostat(p);
      case 1: case 2: return renderSwitch(p,scr.type);
      case 3:  return renderShutter(p);
      case 5:  return renderVeilleuse();
      case 6:  return renderSensor(p.sensorVal,'°','Température','🌡️');
      case 7:  return renderSensor(p.sensorVal,'%','Humidité','💧');
      case 8:  return renderSensor(p.sensorVal,' lux','Luminosité','☀️');
      case 9:  return render4Buttons(p);
      case 10: return renderSlider(p);
      case 11: return renderPlayer(p);
      case 12: return renderKeyboard(p);
      case 13: return renderXpool(p);
      case 14: return renderMeteo(p);
      case 15: case 16: return renderEnergy(p,scr.type);
      case 17: return renderEco3(p);
      default: return `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.15);font-size:0.8rem;">Aperçu non disponible</div>`;
    }
  }

  /* ============ THERMOSTAT — canvas fidèle au fichier fonctionnel ============ */
  /* ═══════════════════════════════════════════════════════════════
     CONSTANTES THERMOSTAT — Géométrie de l'arc canvas
     ANGLE_8H / ANGLE_4H : positions angulaires début/fin de l'arc (en radians)
     L'arc part de 8h (bas-gauche) et tourne dans le sens horaire jusqu'à 4h (bas-droite)
     SPAN_RAD : amplitude totale de l'arc = 240° (4π/3 radians)
     La coupure (zone invisible) est en bas, entre 4h et 8h
  ═══════════════════════════════════════════════════════════════ */
  const TH = {
    ANGLE_8H : (5*Math.PI)/6,   // 150° — début de l'arc
    ANGLE_4H : (Math.PI)/6,     // 30°  — fin de l'arc (repère)
    ANGLE_4H_FULL : (Math.PI)/6 + 2*Math.PI, // 390° pour arc() sens horaire
    SPAN_RAD : (4*Math.PI)/3,   // 240° en radians
  };
    // --- Thermostat : angle SVG depuis valeur normalisée [0..1] ---
  function thAngleFromNorm(t){ return TH.ANGLE_8H + t * TH.SPAN_RAD; }
    // --- Thermostat : interpolation linéaire de couleur RGB ---
  function thLerpColor(c1,c2,t){ return c1.map((v,i)=>Math.round(v+(c2[i]-v)*t)); }
    // --- Thermostat : tableau RGB → string CSS ---
  function thRgb(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
    // --- Thermostat : couleur d'un segment selon la température ---
  function thSegColor(temp, min, max, confMin, confMax){
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    if(temp<=confMin){
      const f=clamp((temp-min)/(confMin-min+1e-9),0,1);
      return thLerpColor([37,99,235],[34,197,94],f);
    } else if(temp<=confMax){
      const f=clamp((temp-confMin)/(confMax-confMin+1e-9),0,1);
      return thLerpColor([34,197,94],[132,204,22],f);
    } else {
      const f=clamp((temp-confMax)/(max-confMax+1e-9),0,1);
      return thLerpColor([132,204,22],[234,179,8],f);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     DESSIN DU THERMOSTAT SUR CANVAS (drawThermoCanvas)
     Appelée par updateThermoVisual() à chaque changement de valeur
     Dessine dans l'ordre :
       1. Arc gris léger (mesure → 4h) : partie non encore atteinte
       2. Arc dégradé coloré (8h → mesure) : bleu=froid / vert=confort / jaune=chaud
          Plages : confMin=19° confMax=25° (modifiables via p.comfortMin/Max)
       3. Point jaune avec halo : position de la CONSIGNE (setpoint)
       4. Flamme 🔥 à 11h (intérieur cercle) : allumée si mesure < consigne
       5. Température mesurée centrée (chiffres seuls, ° en exposant)
       6. Consigne en blanc sous la température
  ═══════════════════════════════════════════════════════════════ */
    // ---------------------------------------------------------------------------
  // THERMOSTAT — Dessine l'arc et les segments sur le canvas Canvas 2D
  // ---------------------------------------------------------------------------
  function drawThermoCanvas(scr){
    const canvas=document.getElementById('thermoCanvas');
    if(!canvas) return;
    const p=scr.params;
    const min=parseFloat(p.minTemp), max=parseFloat(p.maxTemp);
    const confMin=parseFloat(p.comfortMin||19);
    const confMax=parseFloat(p.comfortMax||25);
    const ct=parseFloat(p.currentTemp), sp=parseFloat(p.setpoint);
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const posCurNorm=clamp((ct-min)/(max-min),0,1);
    const posConsNorm=clamp((sp-min)/(max-min),0,1);
    const out = p.thermoOn ? p.thermoOutput : false;
    const ctx=canvas.getContext('2d');
    const W=canvas.width, H=canvas.height;
    const cx=W/2, cy=H/2;
    const R=W*0.42;
    // Point jaune diamètre ~10% W, arc fin = ~1/3 du point
    const dotR=W*0.052;
    const arcW=dotR*0.65;
    ctx.clearRect(0,0,W,H);

    // 1. Arc gris (mesure→4h, partie non atteinte) — léger
    const angleCur=thAngleFromNorm(posCurNorm);
    if(posCurNorm<0.998){
      ctx.beginPath();
      ctx.arc(cx,cy,R,angleCur,TH.ANGLE_4H_FULL,false);
      ctx.strokeStyle='rgba(255,255,255,0.12)';
      ctx.lineWidth=arcW; ctx.lineCap='round'; ctx.stroke();
    }

    // 2. Arc dégradé coloré (8h→mesure)
    if(posCurNorm>0.002){
      const steps=Math.max(4,Math.floor(posCurNorm*180));
      for(let i=0;i<steps;i++){
        const t0=(i/steps)*posCurNorm, t1=((i+1)/steps)*posCurNorm;
        const temp=min+(t0+t1)/2*(max-min);
        ctx.beginPath();
        ctx.arc(cx,cy,R,thAngleFromNorm(t0),thAngleFromNorm(t1),false);
        ctx.strokeStyle=thRgb(thSegColor(temp,min,max,confMin,confMax));
        ctx.lineWidth=arcW;
        ctx.lineCap=(i===0||i===steps-1)?'round':'butt';
        ctx.stroke();
      }
    }

    // 3. Point consigne jaune (diamètre ~3x arcW)
    const angleCons=thAngleFromNorm(posConsNorm);
    const dotX=cx+R*Math.cos(angleCons), dotY=cy+R*Math.sin(angleCons);
    // Halo subtil
    const halo=ctx.createRadialGradient(dotX,dotY,0,dotX,dotY,dotR*1.8);
    halo.addColorStop(0,'rgba(251,191,36,0.35)');
    halo.addColorStop(1,'rgba(251,191,36,0)');
    ctx.beginPath(); ctx.arc(dotX,dotY,dotR*1.8,0,2*Math.PI);
    ctx.fillStyle=halo; ctx.fill();
    // Cercle jaune plein
    ctx.beginPath(); ctx.arc(dotX,dotY,dotR,0,2*Math.PI);
    ctx.fillStyle='#f5c842'; ctx.fill();

    // 4. Flamme — intérieur cercle, position 11h (gauche)
    // 11h = 240° en trigonométrie standard (0°=3h, sens antihoraire)
    // soit 240° * PI/180 en radians
    if(out){
      const flameAng = (240)*Math.PI/180;
      const fr=R*0.58;
      const fx=cx+fr*Math.cos(flameAng), fy=cy+fr*Math.sin(flameAng);
      ctx.font=(W*0.10)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('\uD83D\uDD25', fx, fy);
    }

    // 5. Température mesurée — centrage sur les chiffres seuls, ° en exposant
    ctx.fillStyle='#ffffff';
    ctx.textBaseline='middle';
    const tempStr=parseFloat(ct).toFixed(1);
    const tempFontSize=(tempStr.length>=5 ? W*0.17 : tempStr.length>=4 ? W*0.19 : W*0.22);
    ctx.font='300 '+tempFontSize+'px Inter,ui-sans-serif,sans-serif';
    const tempW=ctx.measureText(tempStr).width;
    const degFontSize=tempFontSize*0.55;
    // centrage : le bloc chiffres est centré, ° collé à droite
    const tempX=cx-tempW/2;
    const tempY=cy-W*0.04+12;
    ctx.textAlign='left';
    ctx.fillText(tempStr, tempX, tempY);
    ctx.font='300 '+degFontSize+'px Inter,ui-sans-serif,sans-serif';
    ctx.textBaseline='top';
    ctx.fillText('\u00B0', tempX+tempW+2, tempY-tempFontSize*0.38);

    // 6. Consigne — blanc pur, centrée indépendamment
    ctx.textAlign='center';
    ctx.fillStyle='#ffffff';
    ctx.font='300 '+(W*0.115)+'px Inter,ui-sans-serif,sans-serif';
    ctx.textBaseline='middle';
    ctx.fillText(Math.round(sp), cx, cy+W*0.14+12);
  }
  /* ═══════════════════════════════════════════════════════════════
     RENDU HTML THERMOSTAT (renderThermostat)
     Génère uniquement le canvas et les boutons − Consigne +
     Le dessin réel est fait par drawThermoCanvas() appelée ensuite
  ═══════════════════════════════════════════════════════════════ */
    // Génère le HTML de l'écran thermostat (cercle + bouton ON/OFF)
  function renderThermostat(p){
    const on = p.thermoOn;
    return `<div class="xd-thermostat" style="position:relative;">
      <button id="thermoToggle" title="${on?'Éteindre':'Allumer'} le thermostat" style="
        position:absolute; top:6px; right:6px; z-index:10;
        background:none; border:none; cursor:pointer; padding:4px;
        opacity:${on?1:0.35}; transition:opacity 0.2s;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none"
             stroke="${on?'#ffffff':'#aaaaaa'}" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 2v6"/>
          <path d="M19.07 4.93A10 10 0 1 1 4.93 4.93"/>
        </svg>
      </button>
      <canvas id="thermoCanvas" width="255" height="255"></canvas>
      <div class="thermo-controls">
        <button class="thermo-btn" id="thMinus">&#8722;</button>
        <span class="thermo-label">Consigne</span>
        <button class="thermo-btn" id="thPlus">+</button>
      </div>
    </div>`;
  }
    // Met à jour l'affichage du thermostat sans recréer le DOM
  function updateThermoVisual(scr){
    drawThermoCanvas(scr);
    const content=document.getElementById('xdContent');
    if(!content) return;
    const btn=content.querySelector('#thermoToggle');
    if(btn){ const on=scr.params.thermoOn; btn.style.opacity=on?1:0.35; btn.querySelector('svg').setAttribute('stroke',on?'#ffffff':'#aaaaaa'); }
  }

  /* ---- Render functions ---- */

  /* ═══════════════════════════════════════════════════════════════
     RENDU HTML INTERRUPTEUR (renderSwitch)
     type=1 : interrupteur simple (icône power)
     type=2 : interrupteur maison (icône home)
     Cercle bleu 210px = hauteur exacte des 3 boutons sidebar
     Bouton blanc centré dans le cercle, label On/Off en position absolue
     Le clic sur le cercle bascule ioState via bindScreenEvents()
  ═══════════════════════════════════════════════════════════════ */
    // ---------------------------------------------------------------------------
  // INTERRUPTEUR / MAISON — Cercle bleu avec icône centré
  // ---------------------------------------------------------------------------
  function renderSwitch(p,type){
    const on=p.ioState==1;
    const label = on ? 'On' : 'Off';
    const iconColor = on ? '#111' : '#444';
    const powerSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v6"/><path d="M19.07 4.93A10 10 0 1 1 4.93 4.93"/></svg>`;
    const homeSvg  = `<svg viewBox="0 0 24 24" fill="${iconColor}" stroke="none"><path d="M3 11.5L12 3l9 8.5V21a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><rect x="9" y="14" width="6" height="8" fill="white" rx="1"/></svg>`;
    const icon = type===2 ? homeSvg : powerSvg;
    return `<div class="xd-switch">
      <div class="switch-ring ${on?'on':''}" id="switchToggle">
        <div class="switch-inner">${icon}</div>
      </div>
    </div>`;
  }

  /* ═══════════════════════════════════════════════════════════════
     RENDU HTML VOLET (renderShutter)
     shutterPos (0-100) : % d'ouverture, 0=fermé, 100=ouvert
     Les lamelles (shutter-slats) ont une hauteur = (100-pos)%
     Boutons ▲ stop ▼ en cercles bleus (même style que nav sidebar)
     Slider caché contrôlé via les boutons (bindScreenEvents)
  ═══════════════════════════════════════════════════════════════ */




  // Met à jour le visuel du volet EN PLACE sans reconstruire le DOM
    // ---------------------------------------------------------------------------
  // VOLET — Met à jour la position du volet dans le DOM (animation progressive)
  // ---------------------------------------------------------------------------
  function applyShutterPos(scr){
    const pos = scr.params.shutterPos;
    const content = document.getElementById('xdContent');
    if(!content) return;
    // Barres de remplissage
    content.querySelectorAll('.shutter-rail-fill').forEach(el => el.style.height = pos + '%');
    // Lamelles
    const slats = content.querySelector('.shutter-slats');
    if(slats) slats.style.height = (100 - pos) + '%';
    // Pourcentage texte
    const pct = content.querySelector('.shutter-pct');
    if(pct) pct.textContent = pos + '%';
    // Slider
    const slider = content.querySelector('#shutterSlider');
    if(slider) slider.value = pos;
  }


  // ---------------------------------------------------------------------------
  // VOLET — Génère le HTML du volet roulant avec rails et lamelles
  // ---------------------------------------------------------------------------
function renderShutter(p){
  const pos = parseInt(p.shutterPos);           // 0 = fermé (bas), 100 = ouvert (haut)
  // La hauteur des lamelles : plus le volet est ouvert, moins les lamelles sont visibles

    // ---------------------------------------------------------------------------
  // SLIDER — Arc circulaire SVG avec point curseur et bouton toggle
  // ---------------------------------------------------------------------------
  function renderSlider(p){
    const v=parseInt(p.sliderVal), r=72, cx=80, cy=80;
    // Même géométrie que le thermostat : arc de 8h (150° canvas) à 4h (30° canvas), 240° horaire
    // Canvas convention : 0°=3h, sens horaire (Y vers le bas)
    const START_DEG = 150; // 8h — même que thermostat, plus de rotation CSS
    const SPAN_DEG = 240;  // amplitude
    // Fonction utilitaire : angle canvas (degrés) → point SVG
    const pt = (deg) => {
      const rad = deg * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    };
    const pStart = pt(START_DEG);
    const pEnd = pt(START_DEG + SPAN_DEG); // fin
    // Cercle complet de fond
    const bgCircle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0090ff" stroke-width="7"/>`;
    // Arc de fond gris (start → end, 240°, large arc, sens horaire)
    const bgPath = `M ${pStart.x.toFixed(2)} ${pStart.y.toFixed(2)} A ${r} ${r} 0 1 1 ${pEnd.x.toFixed(2)} ${pEnd.y.toFixed(2)}`;
    // Arc de valeur (start → position courante)
    const valDeg = START_DEG + (v / 100) * SPAN_DEG;
    const pVal = pt(valDeg);
    const largeArc = (v / 100) * SPAN_DEG > 180 ? 1 : 0;
    const valPath = v > 0 ? `M ${pStart.x.toFixed(2)} ${pStart.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${pVal.x.toFixed(2)} ${pVal.y.toFixed(2)}` : '';
    return `<div class="xd-slider">
      <div class="slider-ring" style="margin-left:-12px;">
        <svg viewBox="0 0 160 160">
          ${bgCircle}
          <path d="${bgPath}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="7" stroke-linecap="round"/>
          ${v > 0 ? `<path d="${valPath}" fill="none" stroke="#0090ff" stroke-width="7" stroke-linecap="round"/>` : ''}
          <circle cx="${pVal.x.toFixed(2)}" cy="${pVal.y.toFixed(2)}" r="7" fill="white"/>

/**
 * Affiche l'écran "Consommation" (type 15) ou "Énergie" (type 16) du X-Display.

 * en son milieu, orientée selon le sens du flux.
 *
 * @param {Object} p - Paramètres de l'écran (contient p.energy)
 * @param {number} type - 15 pour consommation (kW), 16 pour énergie (kWh)
 * @returns {string} Code HTML/SVG du schéma énergétique

  // ---------------------------------------------------------------------------
  // ÉNERGIE / CONSOMMATION — Diagramme en croix avec arcs de Bézier
  // Reçoit les données de l'EcoDevices 3 via MQTT et les affiche
  // Flèches clignotantes selon les conditions de flux actifs
  // ---------------------------------------------------------------------------

  // ECODEVICES 3 (type 17) — Tores 1-8, Fluides, Relais

  function renderEco3(p) {

    const toreNames = Array.isArray(e.toreNames) ? e.toreNames : ['Tore 1','Tore 2','Tore 3','Tore 4','Tore 5','Tore 6','Tore 7','Tore 8'];

    const toreHtml = tores.map((v, i) => {

    const fmtKwh = v => { const n = parseFloat(v)||0; return n >= 1000 ? (n/1000).toFixed(1)+' MWh' : n.toFixed(0)+' kWh'; };

    const fmtPrix = v => (parseFloat(v)||0).toFixed(0)+' €';

    const relayHtml = (id, label, on) =>

  function renderEnergy(p, type) {
  const u = type === 16 ? 'kWh' : 'kW';
  if (!p.energy) p.energy = { prod:58.5, conso:55.5, soutire:55.5, injecte:0, charge:55, decharge:55.5 };
  const e = p.energy;

  const prod    = { x: 126, y: 42 };
  const soutire = { x: 42,  y: 120 };
  const conso   = { x: 210, y: 120 };
  const batt    = { x: 126, y: 198 };
  const center  = { x: 126, y: 120 };

    // Calcule l'intersection de deux droites (contrôle des arcs de Bézier)
  function intersect(p1, d1, p2, d2) {
    const det = d1.x * d2.y - d1.y * d2.x;
    if (Math.abs(det) < 1e-6) return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    const t = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / det;
    return { x: p1.x + t * d1.x, y: p1.y + t * d1.y };
  }
    // Point sur une courbe quadratique de Bézier au paramètre t
  function quadPoint(p0, p1, p2, t) {
    const mt = 1 - t;
    return { x: mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x, y: mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y };
  }
    // Tangente d'une courbe quadratique de Bézier au paramètre t
  function quadTangent(p0, p1, p2, t) {
    const mt = 1 - t;
    return { x: 2*mt*(p1.x-p0.x) + 2*t*(p2.x-p1.x), y: 2*mt*(p1.y-p0.y) + 2*t*(p2.y-p1.y) };
  }
    // Dessine une flèche au milieu d'un arc (avec animation clignotante si actif)
  function arrowAtMid(p0, p1, p2, color, forceAngle=null, offsetX=0, offsetY=0, blink=false) {
    const mid = quadPoint(p0, p1, p2, 0.5);
    const fm = { x: mid.x + offsetX, y: mid.y + offsetY };
    let angle;
    if (forceAngle !== null) { angle = forceAngle; }
    else {
      const tang = quadTangent(p0, p1, p2, 0.5);
      angle = Math.atan2(tang.y, tang.x) * 180 / Math.PI;
      const dirRef = { x: p2.x - p0.x, y: p2.y - p0.y };
      if (dirRef.x*tang.x + dirRef.y*tang.y < 0) angle += 180;
    }
    const anim = blink ? `<animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>` : '';
    const fillColor = blink ? color : 'rgba(255,255,255,0.06)';
    return `<polygon points="-6,-5 -6,5 6,0" fill="${fillColor}" transform="translate(${fm.x},${fm.y}) rotate(${angle})">${anim}</polygon>`;
  }
    // Construit un arc de Bézier entre deux nœuds avec sa flèche
  function getArc(a, b, strokeColor, markerColor, forceAngle=null, ox=0, oy=0, active=true) {
    const dir1 = { x: center.x - a.x, y: center.y - a.y };
    const dir2 = { x: center.x - b.x, y: center.y - b.y };
    const ctrl = intersect(a, dir1, b, dir2);
    const opacity = active ? 1 : 0.07;
    return {
      path: `<path d="M ${a.x} ${a.y} Q ${ctrl.x} ${ctrl.y} ${b.x} ${b.y}" stroke="${strokeColor}" stroke-width="1.5" fill="none" opacity="${opacity}"/>`,
      arrow: arrowAtMid(a, ctrl, b, markerColor, forceAngle, ox, oy, active)
    };
  }

  // Conditions de flux selon le tableau
  const solar2grid = e.injecte > 0;                                                        // Solaire → Réseau : excédent injecté
  const solar2home = e.prod > 0 && e.conso > 0 && (e.prod - e.injecte) > 0;              // Solaire → Maison : part autoconsommée
  const solar2batt = e.prod > 0 && e.charge > 0 && e.prod >= e.injecte;                   // Solaire → Batterie : solaire charge batterie
  const grid2home  = e.soutire > 0 && e.conso > (e.prod - e.injecte + e.decharge);        // Réseau → Maison : réseau compense
  const grid2batt  = e.charge > 0 && e.soutire > 0 && e.prod < e.charge;                  // Réseau → Batterie : réseau charge batterie
  const batt2home  = e.decharge > 0;                                                       // Batterie → Maison : décharge

  const arcs = [
    getArc(prod,    soutire, '#f5a623', '#f5a623', null, 0,    0,   solar2grid),
    getArc(prod,    conso,   '#f5a623', '#f5a623', null, 0,    0,   solar2home),
    getArc(prod,    batt,    '#f5a623', '#f5a623', null, 0,  -15,   solar2batt),
    getArc(soutire, conso,   '#0090ff', '#0090ff', 0,  -15,    0,   grid2home),
    getArc(soutire, batt,    '#a855f7', '#a855f7', null, 0,    0,   grid2batt),
    getArc(batt,    conso,   '#a855f7', '#a855f7', null, 0,    0,   batt2home),
  ];
  const pathsSvg  = arcs.map(a => a.path).join('');
  const arrowsSvg = arcs.map(a => a.arrow).join('');

  return `<div class="xd-energy">
    <div class="energy-diagram">
      <svg class="energy-arrows-svg" viewBox="0 0 252 240">
        ${pathsSvg}
        ${arrowsSvg}
      </svg>
      <div class="energy-node en-solar">
        <div class="energy-node-icon" style="margin-top:-14px;">🔆</div>
        <div class="energy-node-val" style="margin-top:1px;">${e.prod} W</div>
        <div class="energy-node-sub">Prod</div>
      </div>
      <div class="energy-node en-grid">
        <div class="energy-node-icon" style="margin-top:-14px;">🗼</div>
        <div class="energy-node-val" style="margin-top:1px;">→ ${e.soutire} W</div>
        <div class="energy-node-val" style="color:#f5a623;font-size:0.6rem;">← ${e.injecte} W</div>
      </div>
      <div class="energy-node en-home">
        <div class="energy-node-icon" style="margin-top:-14px;">🏠</div>
        <div class="energy-node-val" style="margin-top:1px;">${e.conso} W</div>
        <div class="energy-node-sub">Produite</div>
      </div>
      <div class="energy-node en-batt">
        <div class="energy-node-icon" style="margin-top:-14px;">🔋</div>
        <div class="energy-node-val" style="color:${solar2batt?'#f5a623':'#4ab4ff'};font-size:0.6rem;margin-top:0px;">↓ ${e.charge} W</div>
        <div class="energy-node-val" style="color:#4ab4ff;font-size:0.6rem;margin-top:4px;">↑ ${e.decharge} W</div>
      </div>
    </div>
  </div>`;
}

  const fmt = v => v >= 1000 ? (v/1000).toFixed(1)+' kW' : v+' W';

    // EcoDevices 3 — clic sur les tuiles relais (commande relay_cmd/N)

  /* ═══════════════════════════════════════════════════════════════
     CONNEXION MQTT (Paho)
     Broker : ws:// sur le port 9001 (WebSocket)
     Topics souscrits : basés sur les associations définies dans chaque écran
     Topic température ambiante : X-THL/temp (affiché dans la statusbar)
     addLog() : ajoute une ligne dans le panneau "Traffic MQTT"
     updateSimFromMQTT() : met à jour les valeurs et redessine le simulateur
  ═══════════════════════════════════════════════════════════════ */
  /* ============ MQTT ============ */
    // ---------------------------------------------------------------------------
  // LOGS / TRAFFIC MQTT
  // ---------------------------------------------------------------------------
  // Ajoute une entrée dans l'historique (panneau droit)
  function addLog(message,isError=false){ if(!historyBody) return; const entry=document.createElement('div'); entry.className='log-item'; entry.style.color=isError?'#ff6b35':'#6CC04A'; entry.innerHTML=`<span class="log-time">${new Date().toLocaleTimeString()}</span> — ${message}`; historyBody.prepend(entry); while(historyBody.children.length>150) historyBody.removeChild(historyBody.lastChild); }
    // Ajoute un message dans le traffic MQTT (filtre actif)
  function addTrafficMessage(dir,topic,payload){ if(!trafficListening) return; trafficMessages.push({time:new Date().toLocaleTimeString(),direction:dir,topic,payload}); applyTrafficFilter(); }
    // Filtre et réaffiche les messages MQTT selon le filtre texte
  function applyTrafficFilter(){ if(!trafficBody) return; const f=trafficFilter.toLowerCase(); const filtered=trafficMessages.filter(m=>m.topic.toLowerCase().includes(f)); trafficBody.innerHTML=filtered.map(m=>`<div class="traffic-item"><span class="traffic-time">${m.time}</span> <span class="traffic-topic">[${m.direction}] ${m.topic}</span> → <span class="traffic-payload">${escH(m.payload)}</span></div>`).join(''); if(!filtered.length) trafficBody.innerHTML='<div class="traffic-item" style="color:#7a809a;">Aucun message</div>'; trafficBody.scrollTop=trafficBody.scrollHeight; }
    // Copie le traffic MQTT dans le presse-papier
  function copyTraffic(){ navigator.clipboard.writeText(trafficMessages.map(m=>`${m.time} [${m.direction}] ${m.topic} → ${m.payload}`).join('\n')); addLog('Traffic copié'); }
    // Vide le traffic MQTT
  function clearTraffic(){ trafficMessages=[]; applyTrafficFilter(); addLog('Traffic vidé'); }
    // Vide l'historique
  function clearHistory(){ if(historyBody) historyBody.innerHTML='<div class="log-item" style="color:#7a809a;">Aucune activité</div>'; }
    // Active/désactive l'écoute du traffic MQTT
  function toggleListening(){ trafficListening=!trafficListening; const btn=document.getElementById('listenToggleBtn'); btn.textContent=trafficListening?'Arrêter':'Écouter'; if(!trafficListening) btn.classList.add('btn-primary'); else btn.classList.remove('btn-primary'); }

    // ---------------------------------------------------------------------------
  // MQTT RÉCEPTION — Point d'entrée pour tous les messages MQTT reçus
  // Ordre de traitement :
  //   1. Topic x-display_<ID>/temp (température interne)
  //   2. Topics x-display_<ID>/<n°écran>/<sub> → mise à jour écrans
  //   3. Topics x-pool_<ID>/... → commandes/états X-Pool
  //   4. Topics EcoDevices 3 ($name/...) → données énergie
  // ---------------------------------------------------------------------------
  function onMessageArrived(message){
    addTrafficMessage('SUB',message.destinationName,message.payloadString);
    addLog(`📨 ${message.destinationName} : ${message.payloadString.substring(0,80)}`);
    const topic=message.destinationName, payload=message.payloadString;
    const devId=document.getElementById('deviceId').value||mqttConfig.deviceId||'000001'; // requis pour les regex plus bas
    if(topic===buildXDisplayRootTopic('screenoff')){ screenPowerOn=(payload!=='1'); updateGlobalUI(); return; }
    if(topic===buildXDisplayRootTopic('verr')){ screenLocked=(payload==='1'); updateGlobalUI(); return; }
    if(topic===buildXDisplayRootTopic('temp')){ document.getElementById('xdAmbTemp').textContent=parseFloat(payload).toFixed(1); return; }
    // --- Topics X-Pool (x-pool_<poolId>/...) ---
    const xpoolScr=screens.find(s=>s.type===13 && buildPoolTopic(getPoolId(s))===topic.split('/')[0]);
    if(xpoolScr){
      const xp=xpoolScr.params.xpool;
      if(!xp.notif) xp.notif={unph:false,upph:false,unorp:false,uporp:false};
      const poolPath=topic.split('/').slice(1).join('/');
      const updPool=(field,val)=>{ xp[field]=val; renderSimulator(); renderEditor(); save(); };
      if(poolPath==='outState/filtration') updPool('filtration',payload==='1');
      if(poolPath==='outState/heater')     updPool('heating',payload==='1');
      if(poolPath==='outState/light')      updPool('light',payload==='1');
      if(poolPath==='outState/aux')        updPool('aux',payload==='1');
      if(poolPath==='in/filtration') updPool('filtration',payload==='1');
      if(poolPath==='in/heater')     updPool('heating',payload==='1');
      if(poolPath==='in/light')      updPool('light',payload==='1');
      if(poolPath==='in/aux')        updPool('aux',payload==='1');
      if(poolPath==='ana/eau')   updPool('waterTemp',parseFloat(payload));
      if(poolPath==='ana/air')   updPool('airTemp',parseFloat(payload));
      if(poolPath==='ana/ph')    updPool('ph',parseFloat(payload));
      if(poolPath==='ana/redox') updPool('orp',parseFloat(payload));
      if(poolPath==='notif/unph'||poolPath==='notif/upph'||poolPath==='notif/unorp'||poolPath==='notif/uporp'){
        const key=poolPath.split('/')[1];
        xp.notif[key]=payload==='1';
        if(key==='unph'  && xp.notif.unph)  xp.notif.upph=false;
        if(key==='upph'  && xp.notif.upph)  xp.notif.unph=false;
        if(key==='unorp' && xp.notif.unorp) xp.notif.uporp=false;
        if(key==='uporp' && xp.notif.uporp) xp.notif.unorp=false;
        renderSimulator(); renderEditor(); save();
      }
      return;
    }

    // --- Topics EcoDevices 3 ($name/total_inst/...) ---
    const ecoName = mqttConfig.ecodevicesName||'';
    if(ecoName && topic.startsWith(ecoName+'/')) {
      const ecoPath = topic.slice(ecoName.length+1);
      // --- Mise à jour écrans Consommation / Énergie (type 15/16) ---
      const energyScreens = screens.filter(s=>s.type===15||s.type===16);
      addLog(`🔌 EcoDevices3 [${ecoPath}] = ${payload} → ${energyScreens.length} écran(s) énergie`);
      energyScreens.forEach(scr=>{
        if(!scr.params.energy) scr.params.energy={prod:0,conso:0,soutire:0,injecte:0,charge:0,decharge:0};
        const e=scr.params.energy;
        const toW = v => Math.round(parseFloat(v));
        if(ecoPath==='total_inst/prod')       e.prod       = toW(payload);
        if(ecoPath==='total_inst/conso')      e.conso      = toW(payload);
        if(ecoPath==='total_inst/inject')     e.injecte    = toW(payload);
        if(ecoPath==='total_inst/charge')     e.charge     = toW(payload);
        if(ecoPath==='total_inst/discharge')  e.decharge   = toW(payload);
        const soutire = e.conso - (e.prod - e.injecte) - e.decharge;
        e.soutire = Math.max(0, Math.round(soutire));
      });
      // --- Mise à jour écran EcoDevices 3 (type 17) ---
      const eco3Screens = screens.filter(s=>s.type===17);
      eco3Screens.forEach(scr=>{
        if(!scr.params.eco3) scr.params.eco3={tores:[0,0,0,0,0,0,0,0],toreNames:['Tore 1','Tore 2','Tore 3','Tore 4','Tore 5','Tore 6','Tore 7','Tore 8'],relay1:false,relay2:false,relayName1:'Relais 1',relayName2:'Relais 2',eauInst:0,eauIndex:0,eauPrix:0,gazInst:0,gazIndex:0,gazPrix:0,prodIndex:0,consoIndex:0};
        const e3=scr.params.eco3;
        if(!Array.isArray(e3.tores)) e3.tores=[0,0,0,0,0,0,0,0];
        const toreMatch = ecoPath.match(/^tore\/([1-8])$/);
        if(toreMatch) e3.tores[parseInt(toreMatch[1])-1]=Math.round(parseFloat(payload));
        if(ecoPath==='relay_state/1') e3.relay1 = payload==='1';
        if(ecoPath==='relay_state/2') e3.relay2 = payload==='1';
        if(ecoPath==='total_inst/eau') e3.eauInst = parseFloat(payload);
        if(ecoPath==='total_inst/gaz') e3.gazInst = parseFloat(payload);
        if(ecoPath==='total_index/eau') e3.eauIndex = parseFloat(payload);
        if(ecoPath==='total_index/gaz') e3.gazIndex = parseFloat(payload);
        if(ecoPath==='total_index/prod')  e3.prodIndex  = parseFloat(payload);
        if(ecoPath==='total_index/conso') e3.consoIndex = parseFloat(payload);
        if(ecoPath==='total_prix/eau') e3.eauPrix = parseFloat(payload);
        if(ecoPath==='total_prix/gaz') e3.gazPrix = parseFloat(payload);
      });
      if(energyScreens.length > 0 || eco3Screens.length > 0){
        renderSimulator();
        // Ne pas reconstruire l'éditeur si l'utilisateur est en train de modifier un champ eco3
        const ae = document.activeElement;
        const editingEco3 = ae && (ae.dataset.paramLive||ae.dataset.param||'').startsWith('eco3.');
        if(!editingEco3) renderEditor();
        save();
      }
      return;
    }
    const notifRegex=new RegExp(`^x-pool_${devId}/notif/(unph|upph|unorp|uporp)$`);
    const notifMatch=topic.match(notifRegex);
    if(notifMatch){
      const key=notifMatch[1];
      screens.forEach(scr=>{ if(scr.type===13){ if(!scr.params.xpool.notif) scr.params.xpool.notif={unph:false,upph:false,unorp:false,uporp:false}; scr.params.xpool.notif[key]=(payload==='1'); renderSimulator(); renderEditor(); save(); } });
      return;
    }
    const regex=new RegExp(`^x-display_${devId}/(\\d+)/(.+)$`);
    const match=topic.match(regex);
    if(match){
      let scrId=parseInt(match[1]), sub=match[2], scr=screens.find(s=>s.id===scrId);
      if(scr){
        // Met à jour un champ dans le DOM du panneau gauche sans reconstruire tout l'éditeur
        const syncField=(path,val)=>{
          const card=document.querySelector(`#det-${scr.id}`);
          if(!card) return;
          if(path==='shutterPos'){ const lbl=card.querySelector('.shutter-pos-label'); if(lbl) lbl.textContent=val+'%'; return; }
          const el=card.querySelector(`[data-param="${path}"]`)||card.querySelector(`[data-param-live="${path}"]`);
          if(el){ el.value=(typeof val==='boolean'?val?1:0:val); const span=el.nextElementSibling; if(span&&el.type==='range') span.textContent=val; }
        };
        const upd=(field,val)=>{ scr.params[field]=val; syncField(field,val); renderSimulator(); if(scr.type===0 && scr.id===selectedId) updateThermoVisual(scr); renderEditor(); save(); };
        if(sub==='ThCmd'||sub==='ThCmdReply') upd('setpoint',parseFloat(payload));
        if(sub==='ThMeasureCmd'||sub==='ThMeasureState') upd('currentTemp',parseFloat(payload));
        if(sub==='ThermoOnOff'){ upd('thermoOn',payload==='1'); if(payload==='1') upd('thermoOutput', parseFloat(scr.params.currentTemp) < parseFloat(scr.params.setpoint)); else upd('thermoOutput',false); }
        if(sub==='ThermoOutput') upd('thermoOutput',payload==='1');
        if(sub==='IoCmd'||sub==='IoState') upd('ioState',parseInt(payload));
        if(sub==='ShutterPos') { clearInterval(shutterIntervals[scr.id]); delete shutterIntervals[scr.id]; scr.params.shutterPos=parseInt(payload); syncField('shutterPos',scr.params.shutterPos); applyShutterPos(scr); save(); }
        if(sub==='ShutterCmd'){
          const cmd=parseInt(payload);
          clearInterval(shutterIntervals[scr.id]); delete shutterIntervals[scr.id];
          if(cmd===2){
            shutterIntervals[scr.id]=setInterval(()=>{
              if(scr.params.shutterPos>=100){ clearInterval(shutterIntervals[scr.id]); delete shutterIntervals[scr.id]; return; }
              scr.params.shutterPos=Math.min(100,scr.params.shutterPos+1);
              syncField('shutterPos',scr.params.shutterPos); applyShutterPos(scr); save();
            },100);
          } else if(cmd===1){
            shutterIntervals[scr.id]=setInterval(()=>{
              if(scr.params.shutterPos<=0){ clearInterval(shutterIntervals[scr.id]); delete shutterIntervals[scr.id]; return; }
              scr.params.shutterPos=Math.max(0,scr.params.shutterPos-1);
              syncField('shutterPos',scr.params.shutterPos); applyShutterPos(scr); save();
            },100);
          }
        }
        if(sub==='tempCmd'||sub==='temp') upd('sensorVal',parseFloat(payload));
        if(sub==='humCmd'||sub==='hum') upd('sensorVal',parseFloat(payload));
        if(sub==='lumCmd'||sub==='lum') upd('sensorVal',parseFloat(payload));

        if(sub==='SliderValueCmd'||sub==='SliderValueState') upd('sliderVal',parseInt(payload));
        if(sub==='SliderBtnCmd'||sub==='SliderBtnState') upd('sliderBtn',parseInt(payload));
        const updSub=(path,subpath,val)=>{ let o=scr.params; path.split('.').forEach(k=>o=o[k]); const last=subpath; o[last]=val; syncField(`${path}.${subpath}`,val); renderSimulator(); renderEditor(); save(); };
        if(sub==='Watter'){ updSub('xpool','waterTemp',parseFloat(payload)); }
        if(sub==='Air'){ updSub('xpool','airTemp',parseFloat(payload)); }
        if(sub==='Ph'){ updSub('xpool','ph',parseFloat(payload)); }
        if(sub==='Orp'){ updSub('xpool','orp',parseInt(payload)); }

        if(sub==='Whwind'){ updSub('meteo','wind',parseFloat(payload)); }
        if(sub==='WhLevel'){ updSub('meteo','level',parseInt(payload)); }
        if(sub==='WhPressure'){ updSub('meteo','pressure',parseFloat(payload)); }
        if(sub==='WhSunrise'){ updSub('meteo','sunrise',payload); }
        if(sub==='WhSunset'){ updSub('meteo','sunset',payload); }
        // Prévisions J+1 / J+2 / J+3 (publiées par un vrai IPX800 V5 module Météo ou par le simulateur OWM)
        if(sub==='WhtempD1'){ updSub('meteo.d1','temp',parseFloat(payload)); }

        if(sub==='WhLevelD1'){ updSub('meteo.d1','level',parseInt(payload)); }

    // Met à jour l'apparence du bouton Connecter/Déconnecter
  function setConnectBtn(connected){ let btn=document.getElementById('connectMqttBtn'); if(connected){ btn.textContent='Déconnecter'; btn.classList.remove('btn-primary'); btn.classList.add('btn-secondary'); } else { btn.textContent='Connecter'; btn.classList.remove('btn-secondary'); btn.classList.add('btn-primary'); } let xpBtn=document.getElementById('xpConnect'); if(xpBtn){ xpBtn.textContent=connected?'Déconnecter':'Connecter'; if(connected){ xpBtn.classList.remove('primary'); xpBtn.classList.add('secondary'); } else { xpBtn.classList.remove('secondary'); xpBtn.classList.add('primary'); } } let xpDot=document.getElementById('xpConnDot'); if(xpDot){ if(connected) xpDot.classList.add('connected'); else xpDot.classList.remove('connected'); } }

    // ---------------------------------------------------------------------------
  // CONNEXION MQTT — Initialise le client Paho et se connecte au broker
  // ---------------------------------------------------------------------------
  // ═══════════════════════════════════════════════════════════════
  //  RECONNEXION MQTT AUTOMATIQUE — P0-2
  //  Backoff exponentiel plafonné : 1s, 2s, 4s, 8s, 16s (puis 16s constant)
  //  Retry indéfini jusqu'à clic manuel Déconnecter
  // ═══════════════════════════════════════════════════════════════
  const RECONNECT_DELAYS = [1000, 2000, 4000, 8000, 16000];
  let mqttReconnect = { active: false, attempt: 0, timerId: null };

  // Handler du bouton Connecter/Déconnecter (toggle intelligent)
  function connectMqtt(){
    if (mqttMode === 'local') {
      addLog('Mode local : impossible de se connecter au broker', true);
      return;
    }

    // Cas 1 : déjà connecté → déconnexion manuelle (arrête aussi tout retry en cours)
    if(mqttClient && mqttClient.isConnected()){
      stopReconnect();
      mqttClient.disconnect(); mqttClient = null;
      setConnectBtn(false); document.getElementById('mqttLed').classList.remove('connected');
      addLog('Déconnecté');
      return;
    }

    // Cas 2 : reconnexion automatique en cours → l'annuler
    if(mqttReconnect.active){
      stopReconnect();
      setConnectBtn(false); document.getElementById('mqttLed').classList.remove('connected');
      addLog('Reconnexion automatique annulée');
      return;
    }

    // Cas 3 : nouvelle connexion → tenter (compteur réinitialisé)
    mqttReconnect.attempt = 0;
    attemptConnect();
  }

  // Tentative de connexion (appelée par le premier clic ET par les retries auto)
  function attemptConnect(){
    let brokerUrl=document.getElementById('brokerUrl').value.trim();
    if(!brokerUrl){ addLog('URL requise',true); return; }
    let host,port;
    try{ let url=new URL(brokerUrl); host=url.hostname; port=url.port||(url.protocol==='wss:'?443:80); }
    catch(e){ addLog('URL invalide',true); return; }
    let clientId='x-display_'+(document.getElementById('deviceId').value.trim()||'000001');
    saveMqttConfig();
    try{
      mqttClient=new Paho.MQTT.Client(host,Number(port),clientId);
      let options={ timeout:10, onSuccess:onMqttConnect, onFailure:onMqttFailure };
      let user=document.getElementById('username').value, pass=document.getElementById('password').value;
      if(user){ options.userName=user; options.password=pass; }
      mqttClient.connect(options);
      mqttClient.onConnectionLost=onMqttConnectionLost;
      mqttClient.onMessageArrived=onMessageArrived;
      addLog(`Connexion à ${host}:${port}…`);
    }catch(e){ addLog(e.message,true); scheduleReconnect(); }
  }

  // Callback : connexion perdue → déclenche le retry auto
  function onMqttConnectionLost(resp){
    addLog(`Déconnecté : ${resp.errorMessage||'perte'}`, true);
    document.getElementById('mqttLed').classList.remove('connected');
    mqttClient = null;
    // Arrêter tous les intervals OWM (plus de broker pour publier)
    Object.keys(owmIntervals).forEach(id=>stopOwmInterval(id));
    // NE PAS remettre le bouton à "Connecter" : on entre en reconnexion
    scheduleReconnect();
  }

  // Planifie la prochaine tentative avec backoff exponentiel plafonné
  function scheduleReconnect(){
    if(mqttReconnect.timerId){ clearTimeout(mqttReconnect.timerId); mqttReconnect.timerId=null; }
    const delay = RECONNECT_DELAYS[Math.min(mqttReconnect.attempt, RECONNECT_DELAYS.length-1)];
    mqttReconnect.active = true;
    mqttReconnect.attempt++;
    setConnectBtn(true); // garde "Déconnecter" pour permettre l'annulation manuelle
    addLog(`🔄 Reconnexion auto dans ${delay/1000}s (tentative ${mqttReconnect.attempt})`);
    mqttReconnect.timerId = setTimeout(() => {
      if(!mqttReconnect.active) return; // annulé entre temps
      attemptConnect();
    }, delay);
  }

  // Arrête toute reconnexion planifiée
  function stopReconnect(){
    if(mqttReconnect.timerId){ clearTimeout(mqttReconnect.timerId); mqttReconnect.timerId=null; }
    mqttReconnect.active = false;
    mqttReconnect.attempt = 0;
  }

    // Callback : connexion établie → abonnements x-display + x-pool + ecodevices
  function onMqttConnect(){
    stopReconnect(); // ← reset état reconnexion auto (P0-2)
    addLog('✅ Connecté au broker'); document.getElementById('mqttLed').classList.add('connected'); setConnectBtn(true);
    let subTopic=document.getElementById('subTopic').value.trim();
    if(subTopic&&mqttClient){ mqttClient.subscribe(subTopic); addLog(`Abonné à ${subTopic}`); }
    // Abonnement au topic X-Pool si un ID est configuré
    const xpoolId = mqttConfig.xpoolId||'000001';
    const xpoolTopic = buildPoolTopic(xpoolId, '#');
    if(mqttClient){ mqttClient.subscribe(xpoolTopic); addLog(`Abonné à ${xpoolTopic}`); }
    // Abonnement au topic EcoDevices 3 si configuré
    const ecoName = mqttConfig.ecodevicesName||'';
    if(ecoName && mqttClient){ const ecoTopic=`${ecoName}/#`; mqttClient.subscribe(ecoTopic); addLog(`Abonné à ${ecoTopic}`); }
    // Publier la config des écrans au broker (retained)
    setTimeout(()=>publishScreenConfig(), 500);
    // Démarrer les intervals OWM des écrans météo en mode simulé
    setTimeout(()=>refreshAllOwmIntervals(), 800);
  }
    // Callback : échec de connexion → déclenche le retry auto (P0-2)
  function onMqttFailure(err){
    addLog(`Échec : ${err.errorMessage}`, true);
    document.getElementById('mqttLed').classList.remove('connected');
    mqttClient = null;
    // Arrêter tous les intervals OWM (plus de broker pour publier)
    Object.keys(owmIntervals).forEach(id=>stopOwmInterval(id));
    scheduleReconnect();
  }

    // Envoie la configuration complète des écrans vers le X-Display réel via MQTT
  async function sendMqttConfig(){
    if(!mqttClient||!mqttClient.isConnected()){ alert('MQTT non connecté'); return; }
    for(let i=0;i<screens.length;i++){
      let s=screens[i];
      pubMqttDirect(buildXDisplayRootTopic('new'),s.type);
      await new Promise(r=>setTimeout(r,120));
      pubMqttDirect(buildXDisplayTopic(i,'updateName'),s.name);
      await new Promise(r=>setTimeout(r,120));
    }
    alert(`${screens.length} écran(s) déployé(s)`);
  }
